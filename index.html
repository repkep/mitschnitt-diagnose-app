<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mitschnitt-Diagnose</title>
    <meta name="description" content="Wireshark-Mitschnitt (pcap/pcapng) hochladen und Netzwerkprobleme mit Ursachen und Lösungsvorschlägen erklärt bekommen. Die Analyse läuft vollständig im Browser." />
    <meta name="theme-color" content="#0d6b75" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
    <style>
/* Layout: a single working column. A slim intake bar on top, the verdict
   with capture facts, then tabbed detail views. Findings read like a
   troubleshooting log: badge, measured facts, causes, steps, Wireshark filter. */
:root {
  --bg: #f2f4f3;
  --surface: #fdfdfc;
  --surface-2: #eef1f0;
  --ink: #12191d;
  --ink-2: #46535b;
  --muted: #74818a;
  --rule: #d9dfde;
  --rule-strong: #bfc8c7;
  --accent: #0d6b75;
  --accent-ink: #ffffff;
  --accent-soft: #dcecee;
  --filter-bg: #e4f5e4; /* Wireshark's "valid filter" green */
  --filter-ink: #1d4d1f;
  --crit: #c93333;
  --crit-soft: #fbe9e8;
  --warn: #fab219;
  --warn-ink: #5c3c00;
  --warn-soft: #fdf3dc;
  --info: #3f6474;
  --info-soft: #e5eef1;
  --ok: #1e8a3a;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #6250d6;
  --grid: #e3e7e6;
  --axis: #b9c2c1;
  --shadow: 0 1px 2px rgba(18, 25, 29, 0.06), 0 4px 16px rgba(18, 25, 29, 0.05);

  --font-display: 'IBM Plex Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;

  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.4rem;
  --step-3: 1.9rem;
  --radius: 8px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0e1315;
    --surface: #161c1f;
    --surface-2: #1d2529;
    --ink: #e5ecee;
    --ink-2: #b3c0c5;
    --muted: #84939a;
    --rule: #28333a;
    --rule-strong: #3a4850;
    --accent: #5bbfca;
    --accent-ink: #062a2e;
    --accent-soft: #15353a;
    --filter-bg: #183a1d;
    --filter-ink: #bfe8c2;
    --crit: #ef6b6b;
    --crit-soft: #3a1d1d;
    --warn: #fab219;
    --warn-ink: #2e2000;
    --warn-soft: #362a10;
    --info: #8fb4c4;
    --info-soft: #1b2b33;
    --ok: #4cc26b;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #9085e9;
    --grid: #232d33;
    --axis: #3a464d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}

:root[data-theme='dark'] {
  --bg: #0e1315;
  --surface: #161c1f;
  --surface-2: #1d2529;
  --ink: #e5ecee;
  --ink-2: #b3c0c5;
  --muted: #84939a;
  --rule: #28333a;
  --rule-strong: #3a4850;
  --accent: #5bbfca;
  --accent-ink: #062a2e;
  --accent-soft: #15353a;
  --filter-bg: #183a1d;
  --filter-ink: #bfe8c2;
  --crit: #ef6b6b;
  --crit-soft: #3a1d1d;
  --warn: #fab219;
  --warn-ink: #2e2000;
  --warn-soft: #362a10;
  --info: #8fb4c4;
  --info-soft: #1b2b33;
  --ok: #4cc26b;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #9085e9;
  --grid: #232d33;
  --axis: #3a464d;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.55;
}

h1,
h2,
h3,
h4 {
  font-family: var(--font-display);
  line-height: 1.2;
  text-wrap: balance;
  margin: 0;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

a {
  color: var(--accent);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding-inline: 16px;
}

/* --- top bar ------------------------------------------------------------ */
.topbar {
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
}
.topbar .wrap {
  display: flex;
  align-items: center;
  gap: 12px 20px;
  flex-wrap: wrap;
  padding-block: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-right: auto;
  min-width: 0;
}
.brand svg {
  flex: none;
}
.brand-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: var(--step-1);
  letter-spacing: 0.01em;
}
.brand-sub {
  color: var(--muted);
  font-size: var(--step--1);
}
.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: var(--step--1);
  font-weight: 500;
  white-space: nowrap;
}
.btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn.primary:hover {
  filter: brightness(1.08);
  color: var(--accent-ink);
}
.btn.small {
  padding: 3px 8px;
  font-size: 0.75rem;
}

/* --- intake ---------------------------------------------------------- */
.intake {
  padding-block: 20px 8px;
}
.dropzone {
  display: flex;
  align-items: center;
  gap: 16px 24px;
  flex-wrap: wrap;
  border: 1.5px dashed var(--rule-strong);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 16px 20px;
  transition: border-color 0.15s, background 0.15s;
}
.dropzone.drag {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.dropzone .dz-text {
  flex: 1 1 320px;
  min-width: 0;
}
.dropzone h1 {
  font-size: var(--step-2);
  font-weight: 600;
}
.dropzone p {
  margin: 4px 0 0;
  color: var(--ink-2);
  font-size: var(--step--1);
}
.dz-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.privacy {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ok);
  font-weight: 500;
}

.drop-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.drop-overlay div {
  border: 2px dashed var(--accent);
  border-radius: 12px;
  padding: 40px 56px;
  background: var(--surface);
  font-family: var(--font-display);
  font-size: var(--step-2);
  color: var(--accent);
}

/* --- status / progress / errors -------------------------------------- */
.status {
  margin-block: 12px;
  padding: 14px 18px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--rule);
}
.progress {
  height: 6px;
  border-radius: 3px;
  background: var(--surface-2);
  overflow: hidden;
  margin-top: 10px;
}
.progress > div {
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width 0.2s;
}
.status.error {
  border-color: var(--crit);
  background: var(--crit-soft);
}
.status.error strong {
  color: var(--crit);
}

.demo-note {
  display: flex;
  gap: 10px;
  align-items: baseline;
  flex-wrap: wrap;
  margin-block: 12px 0;
  padding: 10px 14px;
  border-radius: var(--radius);
  background: var(--info-soft);
  color: var(--ink-2);
  font-size: var(--step--1);
}
.demo-note b {
  color: var(--ink);
}

/* --- result head ---------------------------------------------------- */
.result-head {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  gap: 20px;
  margin-block: 16px;
}
@media (max-width: 860px) {
  .result-head {
    grid-template-columns: minmax(0, 1fr);
  }
}
.panel {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 18px 20px;
  min-width: 0;
}
.file-name {
  font-family: var(--font-mono);
  font-size: var(--step-0);
  word-break: break-all;
  color: var(--ink);
}
.eyebrow {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-weight: 600;
}
.verdict {
  display: flex;
  flex-direction: column;
}
.verdict .tiles {
  margin-top: auto;
  padding-top: 16px;
}
.verdict-title {
  font-size: var(--step-3);
  font-weight: 600;
  margin-top: 6px;
}
.top-findings {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.top-findings li {
  display: flex;
  gap: 8px;
  align-items: baseline;
  min-width: 0;
}
.top-findings svg {
  flex: none;
  transform: translateY(2px);
}
.top-findings a {
  color: var(--ink);
  text-decoration-color: var(--rule-strong);
  text-underline-offset: 3px;
}
.top-findings a:hover {
  color: var(--accent);
  text-decoration-color: var(--accent);
}
.verdict-sub {
  color: var(--ink-2);
  margin: 6px 0 0;
}
.tiles {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin-top: 16px;
}
@media (max-width: 520px) {
  .tiles {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.tile {
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 8px 10px;
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  min-width: 0;
}
.tile:hover {
  border-color: var(--rule-strong);
}
.tile[aria-pressed='true'] {
  border-color: var(--ink-2);
  background: var(--surface-2);
}
.tile .n {
  font-size: var(--step-2);
  font-weight: 600;
  font-family: var(--font-display);
  display: block;
}
.tile .l {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.75rem;
  color: var(--ink-2);
  white-space: nowrap;
}

.facts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 18px;
  margin: 14px 0 0;
}
.facts div {
  min-width: 0;
}
.facts dt {
  font-size: 0.72rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.facts dd {
  margin: 0;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

/* --- tabs ----------------------------------------------------------- */
.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--rule);
  overflow-x: auto;
  scrollbar-width: thin;
  margin-top: 8px;
}
.tab {
  border: 0;
  background: none;
  padding: 10px 14px;
  cursor: pointer;
  color: var(--ink-2);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  font-weight: 500;
}
.tab:hover {
  color: var(--ink);
}
.tab[aria-selected='true'] {
  color: var(--ink);
  border-bottom-color: var(--accent);
}
.tab .count {
  font-size: 0.72rem;
  background: var(--surface-2);
  border-radius: 10px;
  padding: 1px 7px;
  margin-left: 6px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.tabpanel {
  padding-block: 18px 40px;
}

/* --- findings ------------------------------------------------------- */
.findings {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.finding {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  min-width: 0;
}
.finding > summary {
  list-style: none;
  cursor: pointer;
  padding: 14px 18px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 4px 14px;
  align-items: start;
}
.finding > summary::-webkit-details-marker {
  display: none;
}
.finding > summary:hover .f-title {
  color: var(--accent);
}
.finding[open] > summary {
  border-bottom: 1px solid var(--rule);
}
.f-main {
  min-width: 0;
}
.f-meta {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 3px;
}
.f-title {
  font-size: var(--step-1);
  font-weight: 600;
}
.f-summary {
  margin: 6px 0 0;
  color: var(--ink-2);
  max-width: 78ch;
}
.chev {
  transition: transform 0.15s;
  color: var(--muted);
  margin-top: 4px;
}
.finding[open] .chev {
  transform: rotate(180deg);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 4px;
  padding: 1px 8px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.badge.critical {
  background: var(--crit-soft);
  color: var(--crit);
}
.badge.warning {
  background: var(--warn-soft);
  color: var(--warn-ink);
}
:root[data-theme='dark'] .badge.warning {
  color: var(--warn);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .badge.warning {
    color: var(--warn);
  }
}
.badge.info {
  background: var(--info-soft);
  color: var(--info);
}
.cat {
  font-size: 0.72rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
}
.sev-icon {
  margin-top: 2px;
}
@media (max-width: 560px) {
  .finding > summary {
    grid-template-columns: minmax(0, 1fr) auto;
    padding: 12px 14px;
  }
  .sev-icon {
    display: none;
  }
  .f-body {
    padding: 14px;
  }
}
.f-body {
  padding: 16px 18px 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.f-body h4 {
  font-size: var(--step--1);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 8px;
}
.evidence {
  margin: 0;
  padding-left: 18px;
}
.evidence li {
  margin-bottom: 4px;
}
.cols {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px 28px;
}
@media (max-width: 760px) {
  .cols {
    grid-template-columns: minmax(0, 1fr);
  }
}
.cols ul,
.cols ol {
  margin: 0;
  padding-left: 20px;
}
.cols li {
  margin-bottom: 6px;
}
.cols ol li::marker {
  font-weight: 600;
  color: var(--accent);
}
.ws {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  border-top: 1px dashed var(--rule);
  padding-top: 12px;
  font-size: var(--step--1);
}
.ws-label {
  color: var(--muted);
  font-weight: 600;
}
.filter {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  background: var(--filter-bg);
  color: var(--filter-ink);
  padding: 3px 8px;
  border-radius: 4px;
  overflow-wrap: anywhere;
  min-width: 0;
}
.frames {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--ink-2);
  overflow-wrap: anywhere;
}

.checks {
  margin-top: 26px;
}
.checks h3 {
  font-size: var(--step-1);
  margin-bottom: 10px;
}
.checks ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 6px 18px;
}
.checks li {
  display: flex;
  gap: 8px;
  align-items: baseline;
  min-width: 0;
}
.checks li svg {
  flex: none;
  color: var(--ok);
  transform: translateY(2px);
}
.checks .d {
  color: var(--muted);
  font-size: var(--step--1);
}
.empty {
  padding: 28px;
  text-align: center;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
}

/* --- tables --------------------------------------------------------- */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--surface);
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: var(--step--1);
  font-variant-numeric: tabular-nums;
}
th,
td {
  text-align: left;
  padding: 7px 10px;
  border-bottom: 1px solid var(--rule);
  vertical-align: top;
}
th {
  font-weight: 600;
  color: var(--ink-2);
  background: var(--surface-2);
  white-space: nowrap;
  position: sticky;
  top: 0;
}
th.sortable {
  cursor: pointer;
}
th.sortable:hover {
  color: var(--ink);
}
tr:last-child td {
  border-bottom: 0;
}
td.num,
th.num {
  text-align: right;
  white-space: nowrap;
}
td.mono {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  white-space: nowrap;
}
.issue {
  display: inline-block;
  font-size: 0.7rem;
  padding: 0 6px;
  border-radius: 3px;
  background: var(--crit-soft);
  color: var(--crit);
  margin: 1px 4px 1px 0;
  white-space: nowrap;
  font-weight: 600;
}
.ok-text {
  color: var(--ok);
}
.dim {
  color: var(--muted);
}

.section {
  margin-bottom: 28px;
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin-bottom: 10px;
}
.section-head h3 {
  font-size: var(--step-1);
}
.section-head p {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: var(--step--1);
}
.search {
  border: 1px solid var(--rule-strong);
  border-radius: 6px;
  padding: 5px 10px;
  background: var(--surface);
  min-width: 0;
  width: min(280px, 100%);
}

/* --- charts --------------------------------------------------------- */
.chart-card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 14px 16px 10px;
  position: relative;
  min-width: 0;
}
.timeline .chart-card + .chart-card {
  margin-top: 12px;
}
.chart-title {
  font-family: var(--font-body);
  font-size: var(--step--1);
  font-weight: 600;
  color: var(--ink);
}
.chart-sub {
  font-size: 0.75rem;
  color: var(--muted);
}
.legend {
  display: flex;
  gap: 14px;
  font-size: 0.75rem;
  color: var(--ink-2);
  margin-top: 4px;
  flex-wrap: wrap;
}
.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.legend i {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
}
svg.chart {
  display: block;
  width: 100%;
  overflow: visible;
}
svg.chart text {
  fill: var(--muted);
  font-size: 11px;
  font-family: var(--font-body);
}
svg.chart .grid line {
  stroke: var(--grid);
  stroke-width: 1;
}
svg.chart .baseline {
  stroke: var(--axis);
  stroke-width: 1;
}
.tooltip {
  position: absolute;
  pointer-events: none;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-radius: 6px;
  box-shadow: var(--shadow);
  padding: 7px 10px;
  font-size: 0.75rem;
  min-width: 150px;
  z-index: 5;
  font-variant-numeric: tabular-nums;
}
.tooltip .t {
  color: var(--muted);
  margin-bottom: 3px;
}
.tooltip .row {
  display: flex;
  align-items: center;
  gap: 6px;
  justify-content: space-between;
}
.tooltip .row span:first-child {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-2);
}
.tooltip .row b {
  color: var(--ink);
}
.tooltip i {
  width: 10px;
  height: 2px;
  display: inline-block;
}
.grid-2 {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 16px;
}
@media (max-width: 860px) {
  .grid-2 {
    grid-template-columns: minmax(0, 1fr);
  }
}

footer.site {
  border-top: 1px solid var(--rule);
  color: var(--muted);
  font-size: var(--step--1);
}
footer.site .wrap {
  padding-block: 18px 28px;
  display: flex;
  justify-content: space-between;
  gap: 8px 20px;
  flex-wrap: wrap;
}

.toast {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  padding: 8px 16px;
  border-radius: 6px;
  font-size: var(--step--1);
  z-index: 60;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}

/* --- bar list ------------------------------------------------------- */
.barlist {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.bar-row {
  display: grid;
  grid-template-columns: minmax(90px, 200px) minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  font-size: var(--step--1);
}
.bar-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink-2);
}
.bar-track {
  height: 12px;
  position: relative;
}
.bar-fill {
  display: block;
  height: 12px;
  background: var(--series-1);
  border-radius: 0 4px 4px 0;
}
.bar-row:hover .bar-fill {
  filter: brightness(1.12);
}
.bar-value {
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  white-space: nowrap;
  font-size: 0.78rem;
}
@media (max-width: 520px) {
  .bar-row {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .bar-track {
    grid-column: 1 / -1;
    grid-row: 2;
  }
}

/* --- selection step ------------------------------------------------- */
.panel-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.selection-note {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin-top: 12px;
  padding: 10px 14px;
  border-radius: var(--radius);
  background: var(--filter-bg);
  color: var(--filter-ink);
  font-size: var(--step--1);
}
.selection-note > span:first-child {
  min-width: 0;
  overflow-wrap: anywhere;
}
.selection-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.prep {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.prep-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 12px 20px;
}
.prep-head-text {
  min-width: 0;
}
.prep-head h2 {
  font-size: var(--step-2);
  font-weight: 600;
  margin-top: 4px;
}
.prep-head p {
  margin: 4px 0 0;
  font-size: var(--step--1);
  overflow-wrap: anywhere;
}
.prep-head-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.prep-intro {
  margin: 0;
  color: var(--ink-2);
  font-size: var(--step--1);
  max-width: 80ch;
}
.prep-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 16px;
}
@media (max-width: 860px) {
  .prep-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}
.prep-box {
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 12px 14px 14px;
  margin: 0;
  min-width: 0;
}
.prep-box legend {
  font-family: var(--font-display);
  font-weight: 600;
  padding: 0 6px;
  margin-left: -6px;
}
.presets {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin-bottom: 8px;
  font-size: var(--step--1);
}
.linkbtn {
  border: 0;
  background: none;
  padding: 2px 0;
  color: var(--accent);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
  font-size: var(--step--1);
  white-space: nowrap;
}
.linkbtn:hover {
  text-decoration-color: var(--accent);
}
.proto-list {
  display: flex;
  flex-direction: column;
}
.proto-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) minmax(40px, 90px) auto;
  gap: 10px;
  align-items: center;
  padding: 4px 2px;
  border-bottom: 1px solid var(--rule);
  font-size: var(--step--1);
  cursor: pointer;
}
.proto-row:last-child {
  border-bottom: 0;
}
.proto-row input {
  margin: 0;
  accent-color: var(--accent);
}
.proto-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.proto-bar {
  height: 6px;
  display: block;
}
.proto-bar span {
  display: block;
  height: 6px;
  border-radius: 0 3px 3px 0;
  background: var(--series-1);
  opacity: 0.55;
}
.proto-count {
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
  text-align: right;
  white-space: nowrap;
  font-size: 0.78rem;
}
.proto-more summary {
  cursor: pointer;
  font-size: 0.78rem;
  color: var(--muted);
  padding: 6px 0 4px 26px;
}
.prep-label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--ink-2);
  margin: 8px 0 4px;
}
.prep-box .prep-label:first-of-type {
  margin-top: 0;
}
.field {
  width: 100%;
  border: 1px solid var(--rule-strong);
  border-radius: 6px;
  padding: 6px 10px;
  background: var(--surface);
  min-width: 0;
}
.field.mono,
.mono {
  font-family: var(--font-mono);
  font-size: 0.82rem;
}
.field[aria-invalid='true'] {
  border-color: var(--crit);
  outline-color: var(--crit);
}
.hint {
  margin: 6px 0 0;
  font-size: 0.75rem;
  color: var(--muted);
}
.hosts {
  margin-top: 6px;
}
.host-row {
  display: grid;
  grid-template-columns: minmax(0, auto) minmax(0, 1fr) auto auto auto;
  gap: 10px;
  align-items: baseline;
  padding: 3px 0;
  border-bottom: 1px solid var(--rule);
  font-size: var(--step--1);
}
.host-row:last-child {
  border-bottom: 0;
}
.host-ip {
  overflow-wrap: anywhere;
}
.host-name {
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 0.78rem;
}
@media (max-width: 520px) {
  .host-row {
    grid-template-columns: minmax(0, 1fr) auto auto;
  }
  .host-name {
    display: none;
  }
  .host-row .proto-count {
    display: none;
  }
}
.prep-advanced summary {
  cursor: pointer;
  font-weight: 600;
  font-size: var(--step--1);
  color: var(--ink-2);
}
.prep-field {
  margin-top: 8px;
}
.examples {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-top: 8px;
  font-size: 0.75rem;
}
.chip {
  border: 1px solid var(--rule-strong);
  background: var(--surface-2);
  border-radius: 4px;
  padding: 1px 7px;
  cursor: pointer;
  font-size: 0.75rem;
}
.chip:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.prep-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 20px;
  border-top: 1px solid var(--rule);
  padding-top: 14px;
}
.prep-summary {
  min-width: 0;
  font-variant-numeric: tabular-nums;
}
.prep-error {
  color: var(--crit);
  font-weight: 500;
}
.prep-foot-actions {
  display: flex;
  align-items: center;
  gap: 10px 16px;
  flex-wrap: wrap;
}
.skip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  color: var(--ink-2);
  cursor: pointer;
}
.skip input {
  accent-color: var(--accent);
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.dedup-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 12px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-size: var(--step--1);
  cursor: pointer;
}
.dedup-row.has-dups {
  border-color: var(--warn);
  background: var(--warn-soft);
}
.dedup-row input {
  margin-top: 3px;
  accent-color: var(--accent);
}
.dedup-row input:disabled + span {
  opacity: 0.7;
}

/* --- drawer ---------------------------------------------------------- */
body.drawer-open {
  overflow: hidden;
}
.drawer-root {
  position: fixed;
  inset: 0;
  z-index: 40;
}
.drawer-backdrop {
  position: absolute;
  inset: 0;
  background: color-mix(in srgb, var(--ink) 35%, transparent);
}
.drawer {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(600px, 100%);
  background: var(--bg);
  border-left: 1px solid var(--rule);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
}
.drawer.wide {
  width: min(1060px, 100%);
}
.drawer-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
}
.drawer-head-text {
  min-width: 0;
}
.drawer-title {
  font-size: var(--step-1);
  font-weight: 600;
  overflow-wrap: anywhere;
}
.drawer-sub {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: var(--step--1);
  overflow-wrap: anywhere;
}
.drawer-sub:empty {
  display: none;
}
.drawer-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.drawer-body {
  flex: 1;
  overflow: auto;
  padding: 16px 18px calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.drawer-body > * {
  flex-shrink: 0;
}
.drawer-h3 {
  font-size: var(--step-0);
  font-weight: 600;
  margin-top: 4px;
}
.drawer-foot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
  border-top: 1px solid var(--rule);
  padding-top: 14px;
}
.linkbtn.back {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  align-self: flex-start;
}

/* --- settings -------------------------------------------------------- */
.profiles {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
@media (max-width: 520px) {
  .profiles {
    grid-template-columns: minmax(0, 1fr);
  }
}
.profile {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 8px 10px;
  cursor: pointer;
  background: var(--surface);
  font-size: var(--step--1);
}
.profile.active {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.profile input {
  margin-top: 3px;
  accent-color: var(--accent);
}
.profile > span {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.th-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.th-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 4px 0;
  font-size: var(--step--1);
}
.th-row label {
  min-width: 0;
}
.th-row.changed label {
  font-weight: 600;
  color: var(--accent);
}
.th-input {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
}
.num-field {
  width: 96px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.th-input .dim {
  width: 2.6em;
}

/* --- packet + connection details ----------------------------------- */
.framebtn {
  font: inherit;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--accent);
  background: none;
  border: 0;
  padding: 0 2px;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
  text-underline-offset: 2px;
  overflow-wrap: anywhere;
  text-align: left;
}
.framebtn:hover {
  text-decoration-color: var(--accent);
}
.frames .framebtn {
  margin-right: 4px;
}
td.mono .framebtn {
  font-size: 0.78rem;
  white-space: nowrap;
}
.pk-note {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  background: var(--info-soft);
  color: var(--ink);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: var(--step--1);
}
.pk-note svg {
  flex: none;
  margin-top: 2px;
  color: var(--info);
}
.pk-analysis {
  background: var(--warn-soft);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: var(--step--1);
}
.pk-analysis ul {
  margin: 6px 0 0;
  padding-left: 18px;
}
.pk-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.pk-layers {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
}
.pk-layer + .pk-layer {
  border-top: 1px solid var(--rule);
}
.pk-layer > summary {
  display: flex;
  gap: 10px;
  align-items: baseline;
  padding: 8px 12px;
  cursor: pointer;
  list-style: none;
}
.pk-layer > summary::-webkit-details-marker {
  display: none;
}
.pk-layer > summary::before {
  content: '▸';
  color: var(--muted);
  width: 10px;
  flex: none;
}
.pk-layer[open] > summary::before {
  content: '▾';
}
.pk-layer:hover > summary,
.pk-layer:focus-within > summary {
  background: var(--accent-soft);
}
.pk-l-title {
  font-weight: 600;
  flex: none;
}
.pk-l-sum {
  color: var(--ink-2);
  font-size: var(--step--1);
  overflow-wrap: anywhere;
  min-width: 0;
}
.pk-fields {
  display: grid;
  grid-template-columns: minmax(0, 10rem) minmax(0, 1fr);
  gap: 3px 14px;
  margin: 0;
  padding: 2px 12px 10px 32px;
  font-size: var(--step--1);
}
.pk-fields dt {
  color: var(--muted);
}
.pk-fields dd {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  overflow-wrap: anywhere;
  padding-top: 1px;
}
.hexdump {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  line-height: 1.55;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 8px 10px;
  overflow-x: auto;
  white-space: pre;
}
.hx-row {
  display: flex;
  gap: 12px;
}
.hx-row .off {
  color: var(--muted);
}
.hx-row .hx {
  min-width: 48ch;
}
.hexdump .hl {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}
.seg {
  display: inline-flex;
  border: 1px solid var(--rule-strong);
  border-radius: 6px;
  overflow: hidden;
  flex-wrap: wrap;
}
.seg button {
  font: inherit;
  font-size: var(--step--1);
  border: 0;
  background: var(--surface);
  color: var(--ink-2);
  padding: 4px 10px;
  cursor: pointer;
}
.seg button + button {
  border-left: 1px solid var(--rule-strong);
}
.seg button.on {
  background: var(--accent);
  color: var(--accent-ink);
}
.conn-chart-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.conn-chart-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  font-size: var(--step--1);
}
.hint-inline {
  font-size: 0.75rem;
  flex: 1;
  min-width: 160px;
}
.conn-charts {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.conn-charts svg.chart {
  touch-action: none;
  user-select: none;
}
.conn-stats th[scope='row'] {
  font-weight: 500;
  color: var(--ink-2);
  text-align: left;
  background: none;
  position: static;
}
.conn-stats tr:last-child th {
  border-bottom: 0;
}
[hidden] {
  display: none !important;
}
.tag {
  display: inline-block;
  font-size: 0.7rem;
  padding: 0 6px;
  border-radius: 3px;
  background: var(--surface-2);
  color: var(--ink-2);
  margin: 1px 4px 1px 0;
  white-space: nowrap;
}
tr.focus td {
  background: var(--accent-soft);
}
.check-inline {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  font-size: var(--step--1);
  cursor: pointer;
}
.check-inline input {
  accent-color: var(--accent);
}

/* --- export ------------------------------------------------------------ */
.profiles.one {
  grid-template-columns: minmax(0, 1fr);
}
.profile.disabled {
  opacity: 0.55;
  cursor: default;
}
.opt-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.opt-list .dedup-row {
  background: var(--surface);
}
.opt-list .dedup-row > span {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.warn-note {
  background: var(--warn-soft);
}
.warn-note svg {
  color: var(--warn-ink);
}
.drawer-foot .export-name {
  margin-right: auto;
  align-self: center;
  font-size: var(--step--1);
  overflow-wrap: anywhere;
  min-width: 0;
}

/* --- two-point comparison ----------------------------------------------- */
.slots {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
@media (max-width: 640px) {
  .slots {
    grid-template-columns: minmax(0, 1fr);
  }
}
.slot {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  border: 1.5px dashed var(--rule-strong);
  border-radius: var(--radius);
  padding: 12px 14px;
  background: var(--surface);
  min-width: 0;
}
.slot.filled {
  border-style: solid;
  border-color: var(--accent);
}
.slot-top {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}
.slot-letter {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.85rem;
}
.slot-label {
  flex: 1;
  min-width: 0;
  font-weight: 600;
}
.slot-file {
  font-size: var(--step--1);
  overflow-wrap: anywhere;
  min-height: 1.4em;
}
.slot-file svg {
  vertical-align: -2px;
}
.path {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 0 4px;
  font-size: var(--step--1);
  flex-wrap: wrap;
}
.path-end {
  border: 1px solid var(--rule-strong);
  border-radius: 6px;
  padding: 4px 10px;
  background: var(--surface-2);
  white-space: nowrap;
}
.path-end b {
  color: var(--accent);
}
.path-mid {
  flex: 1;

  17: 'UDP',
  41: 'IPv6-in-IPv4',
  47: 'GRE',
  50: 'ESP (IPsec)',
  51: 'AH (IPsec)',
  58: 'ICMPv6',
  88: 'EIGRP',
  89: 'OSPF',
  103: 'PIM',
  112: 'VRRP',
  132: 'SCTP',
};

const TCP_FIN = 0x01;
const TCP_SYN = 0x02;
const TCP_RST = 0x04;
const TCP_PSH = 0x08;
const TCP_ACK = 0x10;
const TCP_URG = 0x20;
const TCP_ECE = 0x40;
const TCP_CWR = 0x80;

function dissect(raw) {
  const p = {
    no: raw.no,
    ts: raw.ts,
    len: raw.len,
    caplen: raw.caplen,
    iface: raw.iface,
    linktype: raw.linktype,
    data: raw.data,
    truncated: raw.caplen < raw.len,
    eth: null,
    vlan: null,
    llc: null,
    wlan: null,
    radio: null,
    arp: null,
    stp: null,
    eapol: null,
    ethertype: null,
    ip: null,
    tcp: null,
    udp: null,
    icmp: null,
    icmp6: null,
    l3: null, // name of the network-layer protocol when it is not IP
    outerIp: null,
    l3Offset: null, // where the network layer starts in data
    tunnel: null,
    sll: null,
    payload: null,
    malformed: null,
  };
  try {
    dissectLink(p, raw.data, raw.linktype);
  } catch (e) {
    p.malformed = p.malformed || String(e && e.message ? e.message : e);
  }
  return p;
}

function dissectLink(p, b, lt) {
  switch (lt) {
    case 1:
      return dissectEthernet(p, b, 0);
    case 12:
    case 14:
    case 101:
      return dissectRawIp(p, b, 0);
    case 228:
      return dissectIPv4(p, b, 0, b.length);
    case 229:
      return dissectIPv6(p, b, 0, b.length);
    case 113: {
      if (b.length < 16) return mal(p, 'SLL-Kopf zu kurz');
      p.sll = { pktType: u16(b, 0), ifindex: null };
      return dissectEthertype(p, b, 16, u16(b, 14));
    }
    case 276: {
      if (b.length < 20) return mal(p, 'SLL2-Kopf zu kurz');
      p.sll = { pktType: b[10], ifindex: u32(b, 4) };
      return dissectEthertype(p, b, 20, u16(b, 0));
    }
    case 0:
    case 108: {
      if (b.length < 4) return mal(p, 'Loopback-Kopf zu kurz');
      let af = lt === 108 ? u32(b, 0) : u32le(b, 0);
      if (af > 0xffff) af = u32(b, 0);
      if (af === 2) return dissectIPv4(p, b, 4, b.length);
      if (af === 24 || af === 28 || af === 30 || af === 10) return dissectIPv6(p, b, 4, b.length);
      return;
    }
    case 105:
      return dissect80211(p, b, 0, b.length, false);
    case 127:
      return dissectRadiotap(p, b);
    default:
      p.l3 = 'Unbekannter Linktyp';
  }
}

function mal(p, msg) {
  p.malformed = msg;
}

function dissectRawIp(p, b, o) {
  if (b.length <= o) return;
  const v = b[o] >> 4;
  if (v === 4) return dissectIPv4(p, b, o, b.length);
  if (v === 6) return dissectIPv6(p, b, o, b.length);
  p.l3 = 'Unbekannt';
}

function dissectEthernet(p, b, o) {
  if (b.length < o + 14) return mal(p, 'Ethernet-Kopf zu kurz');
  p.eth = {
    dst: macToString(b, o),
    src: macToString(b, o + 6),
    broadcast: isBroadcastMac(b, o),
    multicast: isMulticastMac(b, o),
  };
  const type = u16(b, o + 12);
  if (type <= 1500) return dissectLlc(p, b, o + 14, Math.min(b.length, o + 14 + type));
  return dissectEthertype(p, b, o + 14, type);
}

function dissectLlc(p, b, o, end) {
  if (end - o < 3) return;
  const dsap = b[o];
  const ssap = b[o + 1];
  p.llc = { dsap, ssap };
  if (dsap === 0x42 && ssap === 0x42) {
    p.l3 = 'STP';
    return dissectStp(p, b, o + 3, end);
  }
  if (dsap === 0xaa && ssap === 0xaa && end - o >= 8) {
    const oui = (b[o + 3] << 16) | (b[o + 4] << 8) | b[o + 5];
    const pid = u16(b, o + 6);
    if (oui === 0) return dissectEthertype(p, b, o + 8, pid);
    if (oui === 0x00000c && pid === 0x2000) p.l3 = 'CDP';
    else if (oui === 0x00000c && (pid === 0x010b || pid === 0x0109)) {
      p.l3 = 'STP';
      return dissectStp(p, b, o + 8, end);
    } else if (oui === 0x00000c && pid === 0x0111) p.l3 = 'UDLD';
    else if (oui === 0x00000c && pid === 0x2003) p.l3 = 'VTP';
    else if (oui === 0x00000c && pid === 0x2004) p.l3 = 'DTP';
    else p.l3 = 'LLC/SNAP';
    return;
  }
  if (dsap === 0xf0) p.l3 = 'NetBIOS';
  else if (dsap === 0xe0) p.l3 = 'IPX';
  else if (dsap === 0xfe) p.l3 = 'OSI (IS-IS)';
  else p.l3 = 'LLC';
}

function dissectStp(p, b, o, end) {
  if (end - o < 4) return;
  const stp = { version: b[o + 2], type: b[o + 3], tc: false, tca: false, rootId: null, bridgeId: null, rootCost: null };
  if (stp.type === 0x80) {
    stp.tcn = true;
  } else if (end - o >= 35) {
    const flags = b[o + 4];
    stp.tc = (flags & 0x01) !== 0;
    stp.tca = (flags & 0x80) !== 0;
    stp.rootId = `${u16(b, o + 5)}/${macToString(b, o + 7)}`;
    stp.rootCost = u32(b, o + 13);
    stp.bridgeId = `${u16(b, o + 17)}/${macToString(b, o + 19)}`;
  }
  p.stp = stp;
}

function dissectEthertype(p, b, o, type) {
  for (let guard = 0; guard < 8; guard++) {
    if (type === 0x8100 || type === 0x88a8 || type === 0x9100) {
      if (b.length < o + 4) return mal(p, 'VLAN-Tag zu kurz');
      const vid = u16(b, o) & 0x0fff;
      if (!p.vlan) p.vlan = vid;
      type = u16(b, o + 2);
      o += 4;
      if (type <= 1500) return dissectLlc(p, b, o, Math.min(b.length, o + type));
      continue;
    }
    if (type === 0x8847 || type === 0x8848) {
      // MPLS label stack, then guess IPv4/IPv6 from the version nibble.
      let bottom = false;
      while (!bottom && o + 4 <= b.length) {
        bottom = (b[o + 2] & 0x01) === 1;
        o += 4;
      }
      p.l3 = 'MPLS';
      return dissectRawIp(p, b, o);
    }
    if (type === 0x8864) {
      if (b.length < o + 8) return;
      const ppp = u16(b, o + 6);
      if (ppp === 0x0021) return dissectIPv4(p, b, o + 8, b.length);
      if (ppp === 0x0057) return dissectIPv6(p, b, o + 8, b.length);
      p.l3 = 'PPPoE';
      return;
    }
    break;
  }
  p.ethertype = type;
  if (p.l3Offset === null) p.l3Offset = o;
  if (type === 0x0800) return dissectIPv4(p, b, o, b.length);
  if (type === 0x86dd) return dissectIPv6(p, b, o, b.length);
  if (type === 0x0806) return dissectArp(p, b, o);
  if (type === 0x888e) return dissectEapol(p, b, o);
  p.l3 = ETHERTYPE_NAMES[type] || `Ethertype 0x${type.toString(16).padStart(4, '0')}`;
}

function dissectArp(p, b, o) {
  p.l3 = 'ARP';
  if (b.length < o + 8) return mal(p, 'ARP zu kurz');
  const hlen = b[o + 4];
  const plen = b[o + 5];
  const op = u16(b, o + 6);
  if (hlen !== 6 || plen !== 4 || b.length < o + 28) {
    p.arp = { op, sha: null, spa: null, tha: null, tpa: null };
    return;
  }
  p.arp = {
    op,
    sha: macToString(b, o + 8),
    spa: ipv4ToString(b, o + 14),
    tha: macToString(b, o + 18),
    tpa: ipv4ToString(b, o + 24),
  };
}

function dissectEapol(p, b, o) {
  p.l3 = 'EAPOL (802.1X)';
  if (b.length < o + 4) return;
  const type = b[o + 1];
  const e = { type, eapCode: null, eapType: null, keyMsg: null };
  if (type === 0 && b.length >= o + 8) {
    e.eapCode = b[o + 4];
    if ((e.eapCode === 1 || e.eapCode === 2) && b.length > o + 8) e.eapType = b[o + 8];
  } else if (type === 3 && b.length >= o + 7) {
    const info = u16(b, o + 5);
    const ack = (info & 0x0080) !== 0;
    const mic = (info & 0x0100) !== 0;
    const secure = (info & 0x0200) !== 0;
    const install = (info & 0x0040) !== 0;
    const pairwise = (info & 0x0008) !== 0;
    if (pairwise) {
      if (ack && !mic) e.keyMsg = 1;
      else if (!ack && mic && !secure) e.keyMsg = 2;
      else if (ack && mic && install) e.keyMsg = 3;
      else if (!ack && mic && secure) e.keyMsg = 4;
    } else {
      e.keyMsg = ack ? 'G1' : 'G2';
    }
  }
  p.eapol = e;
}

function ipv4Checksum(b, o, hl) {
  let sum = 0;
  for (let i = 0; i < hl; i += 2) sum += (b[o + i] << 8) | b[o + i + 1];
  while (sum > 0xffff) sum = (sum & 0xffff) + (sum >>> 16);
  return sum === 0xffff;
}

function dissectIPv4(p, b, o, end) {
  if (p.l3Offset === null) p.l3Offset = o;
  if (end - o < 20) return mal(p, 'IPv4-Kopf zu kurz');
  const vihl = b[o];
  const hl = (vihl & 0x0f) * 4;
  if (vihl >> 4 !== 4 || hl < 20) return mal(p, 'Ungültiger IPv4-Kopf');
  const totalLen = u16(b, o + 2);
  const fragWord = u16(b, o + 6);
  // totalLen 0 happens with TCP segmentation offload on the capturing host.
  const ipEnd = totalLen >= hl ? Math.min(end, o + totalLen) : end;
  const ip = {
    v: 4,
    src: ipv4ToString(b, o + 12),
    dst: ipv4ToString(b, o + 16),
    ttl: b[o + 8],
    proto: b[o + 9],
    id: u16(b, o + 4),
    df: (fragWord & 0x4000) !== 0,
    mf: (fragWord & 0x2000) !== 0,
    fragOffset: (fragWord & 0x1fff) * 8,
    hdrLen: hl,
    totalLen: totalLen >= hl ? totalLen : end - o,
    dscp: b[o + 1] >> 2,
    ecn: b[o + 1] & 3,
    checksumOk: b.length >= o + hl ? ipv4Checksum(b, o, hl) : true,
    checksumZero: b[o + 10] === 0 && b[o + 11] === 0,
    tsoLen: totalLen === 0,
    dstBroadcast: b[o + 16] === 255 && b[o + 17] === 255 && b[o + 18] === 255 && b[o + 19] === 255,
    dstMulticast: b[o + 16] >= 224 && b[o + 16] <= 239,
    offset: o,
  };
  ip.fragment = ip.mf || ip.fragOffset > 0;
  p.ip = ip;
  // L4 length is derived from the IP header, not from the captured length,
  // so truncated captures still report correct segment sizes.
  const l4Len = ip.totalLen - hl;
  if (ip.fragOffset > 0) return;
  dissectL4(p, b, o + hl, ipEnd, ip.proto, l4Len);
}

function dissectIPv6(p, b, o, end) {
  if (p.l3Offset === null) p.l3Offset = o;
  if (end - o < 40) return mal(p, 'IPv6-Kopf zu kurz');
  if (b[o] >> 4 !== 6) return mal(p, 'Ungültiger IPv6-Kopf');
  const payloadLen = u16(b, o + 4);
  let next = b[o + 6];
  const ip = {
    v: 6,
    src: ipv6ToString(b, o + 8),
    dst: ipv6ToString(b, o + 24),
    ttl: b[o + 7],
    proto: next,
    id: null,
    df: true,
    mf: false,
    fragOffset: 0,
    fragment: false,
    hdrLen: 40,
    totalLen: payloadLen ? payloadLen + 40 : end - o,
    dscp: ((b[o] & 0x0f) << 2) | (b[o + 1] >> 6),
    ecn: (b[o + 1] >> 4) & 3,
    checksumOk: true,
    checksumZero: false,
    tsoLen: payloadLen === 0,
    dstBroadcast: false,
    dstMulticast: b[o + 24] === 0xff,
    offset: o,
  };
  p.ip = ip;
  const ipEnd = payloadLen ? Math.min(end, o + 40 + payloadLen) : end;
  let off = o + 40;
  for (let guard = 0; guard < 10; guard++) {
    if (next === 0 || next === 43 || next === 60) {
      if (ipEnd - off < 8) return;
      const nh = b[off];
      off += (b[off + 1] + 1) * 8;
      next = nh;
    } else if (next === 44) {
      if (ipEnd - off < 8) return;
      const nh = b[off];
      const w = u16(b, off + 2);
      ip.fragOffset = w & 0xfff8;
      ip.mf = (w & 1) === 1;
      ip.id = u32(b, off + 4);
      ip.fragment = true;
      off += 8;
      next = nh;
      if (ip.fragOffset > 0) {
        ip.proto = next;
        return;
      }
    } else if (next === 51) {
      if (ipEnd - off < 8) return;
      const nh = b[off];
      off += (b[off + 1] + 2) * 4;
      next = nh;
    } else {
      break;
    }
  }
  ip.proto = next;
  ip.hdrLen = off - o;
  const l4Len = ip.totalLen - ip.hdrLen;
  dissectL4(p, b, off, ipEnd, next, l4Len);
}

function dissectL4(p, b, o, end, proto, l4Len) {
  if (proto === 6) return dissectTcp(p, b, o, end, l4Len);
  if (proto === 17) return dissectUdp(p, b, o, end);
  if (proto === 1) return dissectIcmp(p, b, o, end);
  if (proto === 58) return dissectIcmp6(p, b, o, end);
  if ((p.tunnelDepth = (p.tunnelDepth || 0) + 1) > 4) return;
  if (proto === 4 || proto === 41) {
    // Analyse the inner packet; the outermost header stays available.
    p.tunnel = proto === 4 ? 'IP-in-IP' : 'IPv6-in-IP';
    p.outerIp = p.outerIp || p.ip;
    return proto === 4 ? dissectIPv4(p, b, o, end) : dissectIPv6(p, b, o, end);
  }
  if (proto === 47 && end - o >= 4) {
    const gflags = u16(b, o);
    const ptype = u16(b, o + 2);
    let hl = 4;
    if (gflags & 0x8000) hl += 4;
    if (gflags & 0x2000) hl += 4;
    if (gflags & 0x1000) hl += 4;
    p.tunnel = 'GRE';
    if (ptype === 0x0800 || ptype === 0x86dd || ptype === 0x6558) {
      p.outerIp = p.outerIp || p.ip;
      if (ptype === 0x0800) return dissectIPv4(p, b, o + hl, end);
      if (ptype === 0x86dd) return dissectIPv6(p, b, o + hl, end);
      return dissectEthernet(p, b.subarray(0, end), o + hl);
    }
  }
}

function dissectTcp(p, b, o, end, l4Len) {
  if (end - o < 20) return mal(p, 'TCP-Kopf zu kurz');
  const hdrLen = (b[o + 12] >> 4) * 4;
  const t = {
    sport: u16(b, o),
    dport: u16(b, o + 2),
    seq: u32(b, o + 4),
    ack: u32(b, o + 8),
    hdrLen,
    flags: b[o + 13] | ((b[o + 12] & 1) << 8),
    win: u16(b, o + 14),
    mss: null,
    ws: null,
    sackPerm: false,
    sack: null,
    tsval: null,
    tsecr: null,
    len: 0,
  };
  if (hdrLen < 20) {
    p.tcp = t;
    return mal(p, 'Ungültige TCP-Kopflänge');
  }
  if (hdrLen > 20) {
    const optEnd = Math.min(end, o + hdrLen);
    let q = o + 20;
    while (q < optEnd) {
      const kind = b[q];
      if (kind === 0) break;
      if (kind === 1) {
        q++;
        continue;
      }
      if (q + 1 >= optEnd) break;
      const olen = b[q + 1];
      if (olen < 2 || q + olen > optEnd) break;
      if (kind === 2 && olen === 4) t.mss = u16(b, q + 2);
      else if (kind === 3 && olen === 3) t.ws = b[q + 2];
      else if (kind === 4) t.sackPerm = true;
      else if (kind === 5 && olen >= 10) {
        t.sack = [];
        for (let s = q + 2; s + 8 <= q + olen; s += 8) t.sack.push([u32(b, s), u32(b, s + 4)]);
      } else if (kind === 8 && olen === 10) {
        t.tsval = u32(b, q + 2);
        t.tsecr = u32(b, q + 6);
      }
      q += olen;
    }
  }
  t.len = Math.max(0, l4Len - hdrLen);
  p.tcp = t;
  const pStart = o + hdrLen;
  p.payload = pStart < end ? b.subarray(pStart, Math.min(end, pStart + t.len)) : b.subarray(0, 0);
}

function dissectUdp(p, b, o, end) {
  if (end - o < 8) return mal(p, 'UDP-Kopf zu kurz');
  const len = u16(b, o + 4);
  p.udp = { sport: u16(b, o), dport: u16(b, o + 2), len, payloadLen: Math.max(0, len - 8) };
  p.payload = b.subarray(o + 8, Math.min(end, o + Math.max(8, len)));
}

function innerIp(b, o, end) {
  // Header of the packet that triggered an ICMP error.
  if (end - o < 20) return null;
  const v = b[o] >> 4;
  if (v === 4) {
    const hl = (b[o] & 0x0f) * 4;
    const proto = b[o + 9];
    const r = { v: 4, src: ipv4ToString(b, o + 12), dst: ipv4ToString(b, o + 16), proto, sport: null, dport: null, len: u16(b, o + 2) };
    if ((proto === 6 || proto === 17) && end - (o + hl) >= 4) {
      r.sport = u16(b, o + hl);
      r.dport = u16(b, o + hl + 2);
    }
    if (proto === 1 && end - (o + hl) >= 1) r.icmpType = b[o + hl];
    return r;
  }
  if (v === 6 && end - o >= 40) {
    const proto = b[o + 6];
    const r = { v: 6, src: ipv6ToString(b, o + 8), dst: ipv6ToString(b, o + 24), proto, sport: null, dport: null, len: u16(b, o + 4) + 40 };
    if ((proto === 6 || proto === 17) && end - (o + 40) >= 4) {
      r.sport = u16(b, o + 40);
      r.dport = u16(b, o + 42);
    }
    return r;
  }
  return null;
}

function dissectIcmp(p, b, o, end) {
  if (end - o < 4) return mal(p, 'ICMP zu kurz');
  const type = b[o];
  const code = b[o + 1];
  const ic = { type, code, id: null, seq: null, mtu: null, inner: null, gateway: null };
  if ((type === 0 || type === 8) && end - o >= 8) {
    ic.id = u16(b, o + 4);
    ic.seq = u16(b, o + 6);
  } else if (type === 3 || type === 11 || type === 12 || type === 5 || type === 4) {
    if (type === 3 && code === 4 && end - o >= 8) ic.mtu = u16(b, o + 6);
    if (type === 5 && end - o >= 8) ic.gateway = ipv4ToString(b, o + 4);
    ic.inner = innerIp(b, o + 8, end);
  }
  p.icmp = ic;
}

function dissectIcmp6(p, b, o, end) {
  if (end - o < 4) return mal(p, 'ICMPv6 zu kurz');
  const type = b[o];
  const code = b[o + 1];
  const ic = { type, code, id: null, seq: null, mtu: null, inner: null, target: null, naFlags: null, srcLinkAddr: null };
  if ((type === 128 || type === 129) && end - o >= 8) {
    ic.id = u16(b, o + 4);
    ic.seq = u16(b, o + 6);
  } else if (type >= 1 && type <= 4) {
    if (type === 2 && end - o >= 8) ic.mtu = u32(b, o + 4);
    ic.inner = innerIp(b, o + 8, end);
  } else if ((type === 135 || type === 136 || type === 137) && end - o >= 24) {
    ic.target = ipv6ToString(b, o + 8);
    if (type === 136) ic.naFlags = b[o + 4];
    // Options: look for source/target link-layer address.
    let q = o + 24;
    while (q + 8 <= end) {
      const ot = b[q];
      const ol = b[q + 1] * 8;
      if (ol === 0) break;
      if ((ot === 1 || ot === 2) && ol >= 8) ic.srcLinkAddr = macToString(b, q + 2);
      q += ol;
    }
  }
  p.icmp6 = ic;
}

// --- IEEE 802.11 -----------------------------------------------------------

const RADIOTAP_FIELDS = [
  // [align, size] for bits 0..6
  [8, 8], // TSFT
  [1, 1], // Flags
  [1, 1], // Rate
  [2, 4], // Channel
  [1, 2], // FHSS
  [1, 1], // dBm antenna signal
  [1, 1], // dBm antenna noise
];

function dissectRadiotap(p, b) {
  if (b.length < 8) return mal(p, 'Radiotap-Kopf zu kurz');
  const rtLen = u16le(b, 2);
  if (rtLen > b.length || rtLen < 8) return mal(p, 'Ungültige Radiotap-Länge');
  const present = u32le(b, 4);
  let q = 4;
  let w = present;
  while (w & 0x80000000 && q + 4 < rtLen) {
    q += 4;
    w = u32le(b, q);
  }
  q += 4;
  const radio = { signal: null, noise: null, rate: null, freq: null, fcs: false, badFcs: false, flagsOffset: null };
  for (let bit = 0; bit < RADIOTAP_FIELDS.length; bit++) {
    if (!(present & (1 << bit))) continue;
    const [align, size] = RADIOTAP_FIELDS[bit];
    q = Math.ceil(q / align) * align;
    if (q + size > rtLen) break;
    if (bit === 1) {
      const f = b[q];
      radio.flagsOffset = q;
      radio.fcs = (f & 0x10) !== 0;
      radio.badFcs = (f & 0x40) !== 0;
