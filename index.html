    rx.next = seqAdd(seq, len);
    rx.bytes += len - off;
    while (rx.pending && rx.pending.size) {
      let progressed = false;
      for (const [s, item] of rx.pending) {
        const o2 = (rx.next - s) | 0;
        if (o2 < 0) continue;
        rx.pending.delete(s);
        if (o2 < item.payload.length) {
          this.emit(conn, di, item.payload.subarray(o2), item.p, false);
          rx.next = seqAdd(s, item.payload.length);
          rx.bytes += item.payload.length - o2;
        }
        progressed = true;
      }
      if (!progressed) break;
    }
    if (rx.bytes > STREAM_LIMIT) rx.done = true;
  }

  emit(conn, di, data, p, gapAfter) {
    for (const c of this.consumers) c.onTcpData(conn, di, data, p, gapAfter);
  }

  // ------------------------------------------------------------------------
  finish() {
    const ctx = this.ctx;
    const T = ctx.thresholds;
    const captureEnd = ctx.lastTs;
    const findings = [];
    const checks = [];
    const conns = this.allConns;
    if (!conns.length) {
      this.result = { findings, checks, conns: [], stats: null };
      return this.result;
    }

    // Aggregate counters
    const tot = { retrans: 0, fast: 0, spurious: 0, ooo: 0, lost: 0, ackUnseen: 0, dupAcks: 0, zeroWin: 0, winFull: 0, keepAlive: 0 };
    for (const c of conns) {
      for (const d of c.dirs) for (const k of Object.keys(tot)) tot[k] += d[k];
      if (c.dirs.some((d) => d.zeroWinSince !== null)) {
        for (const d of c.dirs) {
          if (d.zeroWinSince !== null) {
            const dur = Math.max(0, captureEnd - d.zeroWinSince);
            d.zeroWinTime += dur;
            d.zeroWinMax = Math.max(d.zeroWinMax, dur);
            d.zeroWinOpenAtEnd = true;
          }
        }
      }
      c.state = this.classify(c, captureEnd);
      c.serverIdx = this.serverIndex(c);
      c.service = servicePort('tcp', c.ep[0].port, c.ep[1].port);
    }
    const dataSegs = this.dataSegments;
    const rate = dataSegs ? tot.retrans / dataSegs : 0;
    const label = (c) => connLabel(c);

    // 1. Retransmissions ----------------------------------------------------
    if (tot.retrans > 0) {
      const top = conns
        .map((c) => ({ c, r: c.dirs[0].retrans + c.dirs[1].retrans, d: c.dirs[0].dataSegs + c.dirs[1].dataSegs }))
        .filter((x) => x.r > 0)
        .sort((a, b) => b.r - a.r);
      const worstFlowRate = top.reduce((m, x) => (x.r >= 10 && x.d ? Math.max(m, x.r / x.d) : m), 0);
      let severity = null;
      if (rate >= T.tcpRetransCrit / 100 && tot.retrans >= 20) severity = 'critical';
      else if ((rate >= T.tcpRetransWarn / 100 && tot.retrans >= 10) || worstFlowRate >= Math.max(0.1, (T.tcpRetransCrit / 100) * 2)) severity = 'warning';
      else if (tot.retrans >= 5 && rate >= T.tcpRetransWarn / 500) severity = 'info';
      if (severity) {
        const senders = new Map();
        for (const x of top) for (const d of x.c.dirs) if (d.retrans) senders.set(d.ip, (senders.get(d.ip) || 0) + d.retrans);
        const rto = tot.retrans - tot.fast - tot.spurious;
        const evidence = [
          `${fmtInt(tot.retrans)} von ${fmtInt(dataSegs)} TCP-Datensegmenten wurden erneut gesendet (${fmtPct(rate, 2)}).`,
          `Davon Fast Retransmissions: ${fmtInt(tot.fast)} (Verlust per Duplicate ACK erkannt), sonstige/Timeout-basierte: ${fmtInt(rto - 0)}${tot.spurious ? `, unnötige (spurious): ${fmtInt(tot.spurious)}` : ''}.`,
          `Duplicate ACKs: ${fmtInt(tot.dupAcks)} · Out-of-Order-Segmente: ${fmtInt(tot.ooo)} · Lücken im Datenstrom („previous segment not captured“): ${fmtInt(tot.lost)}.`,
        ];
        const topSenders = [...senders.entries()].sort((a, b) => b[1] - a[1]);
        if (topSenders.length && topSenders[0][1] / tot.retrans >= 0.8 && top.length > 1) {
          evidence.push(`${fmtPct(topSenders[0][1] / tot.retrans, 0)} der Wiederholungen sendet ${topSenders[0][0]} – das Problem betrifft vor allem den Pfad von bzw. zu diesem Host.`);
        } else if (top.length > 3) {
          evidence.push(`Betroffen sind ${fmtInt(top.length)} Verbindungen – eher ein allgemeines Problem des Übertragungswegs als eines einzelnen Servers.`);
        }
        findings.push(
          finding({
            id: 'tcp.retransmissions',
            severity,
            category: 'TCP',
            title: `Paketverlust: ${fmtPct(rate, 2)} TCP-Retransmissions`,
            summary:
              severity === 'info'
                ? 'Einzelne Segmente mussten wiederholt werden. In geringem Umfang ist das normal, sollte aber nicht dauerhaft auftreten.'
                : 'TCP musste auffällig viele Segmente erneut senden. Jeder Verlust bremst die Verbindung (Halbierung des Sendefensters, Timeouts von 200 ms bis mehreren Sekunden) und ist für Nutzer als Langsamkeit oder Hänger spürbar.',
            evidence,
            table: {
              columns: ['Verbindung', 'Datensegmente', 'Retransmissions', 'Anteil'],
              rows: top.slice(0, 10).map((x) => [label(x.c), fmtInt(x.d), fmtInt(x.r), fmtPct(x.d ? x.r / x.d : 0, 1)]),
            },
            causes: [
              'Überlastete Leitung oder Engpass (WAN-/Internet-Uplink, VPN): Router- und Switch-Puffer laufen über und verwerfen Pakete.',
              'Physikalische Fehler: defektes Kabel/Patchfeld, verschmutzte LWL-Stecker, Duplex-Mismatch (eine Seite fest auf 100/Full, andere Auto) – erkennbar an CRC-/FCS-Fehlern am Switchport.',
              'WLAN-Störungen, schwaches Signal oder überlastete Funkzelle.',
              'Überlastete Firewall, Proxy, Load Balancer oder ein Gerät mit vollem CPU/Session-Table.',
              'Policing/Rate-Limiting beim Provider oder durch QoS-Richtlinien, die Überschuss hart verwerfen.',
            ],
            actions: [
              'Fehlerzähler an Switch- und Router-Ports entlang des Pfads prüfen (z. B. „show interface“: CRC, input/output drops, overruns; Linux: „ethtool -S“, „ip -s link“).',
              'Speed/Duplex auf beiden Seiten vergleichen; beide auf Auto-Negotiation oder beide fest einstellen.',
              'Auslastung der beteiligten Leitungen zum Zeitpunkt des Mitschnitts prüfen (SNMP/NetFlow). Bei Engpass: Bandbreite erhöhen oder QoS mit Shaping statt Policing.',
              'Den Verlustort eingrenzen: gleichzeitig an zwei Punkten mitschneiden (z. B. Client und Server bzw. vor/hinter der Firewall) und vergleichen, wo Pakete fehlen.',
              'Bei WLAN: Mitschnitt kabelgebunden wiederholen. Verschwinden die Retransmissions, liegt die Ursache im Funknetz.',
            ],
            filter: 'tcp.analysis.retransmission || tcp.analysis.fast_retransmission',
            frames: this.ex.RETRANS.list,
            weight: tot.retrans,
          }),
        );
      } else {
        checks.push(check('TCP', 'Retransmissions', `${fmtPct(rate, 2)} – unauffällig`));
      }
    } else if (dataSegs > 0) {
      checks.push(check('TCP', 'Retransmissions', 'keine'));
    }

    // 2. Spurious retransmissions -----------------------------------------
    if (tot.spurious >= 5 && tot.spurious >= tot.retrans * 0.25) {
      findings.push(
        finding({
          id: 'tcp.spurious',
          severity: tot.spurious >= 50 ? 'warning' : 'info',
          category: 'TCP',
          title: `${fmtInt(tot.spurious)} unnötige Retransmissions (spurious)`,
          summary: 'Es wurden Daten erneut gesendet, die der Empfänger bereits bestätigt hatte. Der Sender hat die Bestätigung also nicht (rechtzeitig) gesehen.',
          evidence: [`${fmtInt(tot.spurious)} Segmente lagen vollständig unterhalb der bereits bestätigten Sequenznummer.`],
          causes: [
            'ACKs gehen auf dem Rückweg verloren oder werden stark verzögert (asymmetrische Leitung, überlasteter Upload).',
            'Retransmission-Timeout (RTO) des Senders ist zu knapp für schwankende Latenzen (z. B. Mobilfunk, WLAN, Satellit).',
            'Mitschnittpunkt liegt nahe am Empfänger: Die ACKs sind im Mitschnitt zu sehen, gehen aber danach verloren.',
          ],
          actions: [
            'Rückweg (Empfänger → Sender) auf Verluste und Auslastung prüfen, insbesondere den Upload bei asymmetrischen Anschlüssen.',
            'Auf dem Sender mitschneiden, um zu sehen, ob die ACKs dort ankommen.',
            'Bei stark schwankender Latenz: Jitter-Quelle suchen (WLAN, Bufferbloat).',
          ],
          filter: 'tcp.analysis.spurious_retransmission',
          frames: this.ex.SPURIOUS.list,
          weight: tot.spurious,
        }),
      );
    }

    // 3. Out of order -------------------------------------------------------
    if (tot.ooo >= 10 && dataSegs && tot.ooo / dataSegs >= 0.005) {
      const r = tot.ooo / dataSegs;
      findings.push(
        finding({
          id: 'tcp.out_of_order',
          severity: r >= 0.02 ? 'warning' : 'info',
          category: 'TCP',
          title: `Pakete kommen in falscher Reihenfolge an (${fmtPct(r, 1)})`,
          summary: 'Segmente treffen in vertauschter Reihenfolge ein. TCP hält das zwar aus, aber Empfänger senden dabei Duplicate ACKs und lösen ggf. unnötige Fast Retransmissions aus.',
          evidence: [`${fmtInt(tot.ooo)} Out-of-Order-Segmente bei ${fmtInt(dataSegs)} Datensegmenten.`],
          causes: [
            'Lastverteilung über mehrere parallele Pfade pro Paket statt pro Verbindung (ECMP, Port-Channel/LACP mit Round-Robin, Multipath-VPN/SD-WAN).',
            'Paketverlust mit anschließender Wiederholung, wenn die Wiederholung schneller kam als im Mitschnitt erkennbar.',
            'Mitschnitt-Artefakt: Mehrere Interfaces oder SPAN-Quellen wurden zusammengeführt, Zeitstempel weichen voneinander ab.',
          ],
          actions: [
            'Load-Balancing-Hash auf „per Flow“ (Quell-/Ziel-IP + Ports) umstellen.',
            'SD-WAN/Multipath-Richtlinien für diese Anwendung prüfen.',
            'Wenn der Mitschnitt von einem SPAN-Port mit mehreren Quellen stammt: an einem einzelnen Punkt (TAP oder Endgerät) wiederholen.',
          ],
          filter: 'tcp.analysis.out_of_order',
          frames: this.ex.OOO.list,
          weight: tot.ooo,
        }),
      );
    }

    // 4. Capture drops (ACKed unseen) ---------------------------------------
    if (tot.ackUnseen > 0) {
      const r = dataSegs ? tot.ackUnseen / dataSegs : 0;
      findings.push(
        finding({
          id: 'capture.acked_unseen',
          severity: tot.ackUnseen >= 10 || r >= 0.005 ? 'warning' : 'info',
          category: 'Mitschnitt',
          title: 'Mitschnitt ist lückenhaft: bestätigte Daten fehlen',
          summary:
            'Empfänger haben Daten bestätigt, die im Mitschnitt nicht vorkommen. Die Pakete wurden also übertragen, aber nicht aufgezeichnet. Ein Teil der gemeldeten „Verluste“ kann deshalb ein Mitschnitt-Problem sein und nicht das Netz.',
          evidence: [
            `${fmtInt(tot.ackUnseen)} ACKs für nicht mitgeschnittene Segmente („ACKed unseen segment“).`,
            `${fmtInt(tot.lost)} Lücken im Datenstrom („previous segment not captured“).`,
          ],
          causes: [
            'SPAN-/Mirror-Port überlastet (Summe der gespiegelten Ports übersteigt die Bandbreite des Ziel-Ports).',
            'Mitschnitt-Rechner zu langsam oder Capture-Puffer zu klein (Kernel-Drops).',
            'Asymmetrisches Routing: Ein Teil der Pakete nimmt einen anderen Weg, an dem nicht mitgeschnitten wurde.',
            'Mitschnitt auf einem Host mit Offloading (LRO/GRO), wodurch Segmente zusammengefasst wurden.',
          ],
          actions: [
            'Größeren Puffer verwenden (dumpcap/Wireshark: „-B 512“, tcpdump: „-B 524288“) und Snaplen begrenzen (z. B. „-s 128“), wenn nur Header gebraucht werden.',
            'Möglichst einen Hardware-TAP statt SPAN einsetzen bzw. weniger Quellports spiegeln.',
            'In Ring-Buffer-Dateien schreiben (dumpcap „-b filesize:…“) und nur relevanten Verkehr per Capture-Filter aufzeichnen.',
          ],
          filter: 'tcp.analysis.ack_lost_segment',
          frames: this.ex.ACK_UNSEEN.list,
          weight: tot.ackUnseen,
        }),
      );
    }

    // 5. Zero window ----------------------------------------------------------
    const zwDirs = [];
    for (const c of conns) for (let i = 0; i < 2; i++) if (c.dirs[i].zeroWin > 0) zwDirs.push({ c, d: c.dirs[i] });
    if (zwDirs.length) {
      const byHost = new Map();
      for (const { c, d } of zwDirs) {
        const h = byHost.get(d.ip) || { ip: d.ip, count: 0, time: 0, max: 0, conns: 0, open: false, ports: new Set() };
        h.count += d.zeroWin;
        h.time += d.zeroWinTime;
        h.max = Math.max(h.max, d.zeroWinMax);
        h.conns++;
        h.open = h.open || !!d.zeroWinOpenAtEnd;
        h.ports.add(serviceLabel('tcp', c.service));
        byHost.set(d.ip, h);
      }
      const hosts = [...byHost.values()].sort((a, b) => b.time - a.time || b.count - a.count);
      const totalTime = hosts.reduce((s, h) => s + h.time, 0);
      const severity = totalTime >= T.zeroWinCritSec || tot.zeroWin >= 50 || hosts.some((h) => h.open && h.max >= Math.min(2, T.zeroWinCritSec)) ? 'critical' : 'warning';
      findings.push(
        finding({
          id: 'tcp.zero_window',
          severity,
          category: 'TCP',
          title: `Empfänger überlastet: TCP Zero Window bei ${hosts.length === 1 ? hosts[0].ip : `${hosts.length} Hosts`}`,
          summary:
            'Ein Empfänger hat sein Empfangsfenster auf 0 gesetzt. Seine Anwendung holt die Daten nicht schnell genug aus dem Socket-Puffer, und der Sender muss pausieren. Das Problem liegt beim Empfänger-System oder seiner Anwendung, nicht im Netzwerk.',
          evidence: [
            `${fmtInt(tot.zeroWin)} Zero-Window-Meldungen in ${fmtInt(zwDirs.length)} Verbindungsrichtung(en); Übertragung stand dadurch insgesamt ca. ${fmtTime(totalTime)} still.`,
            ...hosts.filter((h) => h.open).map((h) => `${h.ip}: Fenster war bis zum Ende des Mitschnitts geschlossen – die Anwendung hängt möglicherweise.`),
          ],
          table: {
            columns: ['Empfänger (meldet Zero Window)', 'Meldungen', 'Stillstand gesamt', 'längste Pause', 'Dienst'],
            rows: hosts.slice(0, 10).map((h) => [h.ip, fmtInt(h.count), fmtTime(h.time), fmtTime(h.max), [...h.ports].slice(0, 3).join(', ')]),
          },
          causes: [
            'Die empfangende Anwendung ist ausgelastet oder blockiert (CPU am Limit, langsame Festplatte/Datenbank, Garbage Collection, Deadlock).',
            'Zu kleiner Socket-Empfangspuffer bzw. deaktiviertes TCP-Autotuning.',
            'Virenscanner, DLP- oder Inspection-Software auf dem Empfänger bremst die Verarbeitung.',
            'Der Empfänger schreibt die Daten auf ein langsames Ziel (Netzlaufwerk, USB-Disk, volle Platte).',
          ],
          actions: [
            'Auf dem Empfänger CPU, RAM, Datenträger-Latenz und Prozess-Auslastung zum Zeitpunkt prüfen (Task-Manager/Resource Monitor, top/iostat).',
            'Anwendungs-Logs des Empfängers prüfen; bei Servern auf Thread-Pool- oder Verbindungs-Limits achten.',
            'TCP-Autotuning prüfen – Windows: „netsh int tcp show global“ (Receive Window Auto-Tuning Level = normal); Linux: net.ipv4.tcp_rmem / net.core.rmem_max.',
            'Testweise Virenscanner/Echtzeitscan für den betroffenen Pfad ausnehmen.',
          ],
          filter: 'tcp.analysis.zero_window || tcp.analysis.zero_window_probe',
          frames: this.ex.ZERO_WIN.list,
          weight: tot.zeroWin,
        }),
      );
    } else if (this.segments > 0) {
      checks.push(check('TCP', 'Empfangsfenster (Zero Window)', 'keine Engpässe beim Empfänger'));
    }

    // 6. Window full / window scaling ----------------------------------------
    const scalingOff = conns.filter((c) => c.scaleKnown && c.noScaling);
    const bigNoScale = scalingOff.filter((c) => c.dirs[0].payload + c.dirs[1].payload >= 1e6 && (c.irtt || 0) >= 0.01);
    if (bigNoScale.length || (scalingOff.length && tot.winFull >= 10)) {
      const rows = (bigNoScale.length ? bigNoScale : scalingOff).slice(0, 10).map((c) => {
        const s = c.dirs[c.client ?? 0];
        const r = c.dirs[1 - (c.client ?? 0)];
        return [label(c), s.ws === null ? 'nein' : `ja (×${2 ** s.ws})`, r.ws === null ? 'nein' : `ja (×${2 ** r.ws})`, c.irtt ? fmtBits((65535 * 8) / c.irtt) : '–'];
      });
      findings.push(
        finding({
          id: 'tcp.no_window_scaling',
          severity: bigNoScale.length ? 'warning' : 'info',
          category: 'TCP',
          title: `TCP Window Scaling nicht aktiv (${fmtInt(scalingOff.length)} Verbindungen)`,
          summary:
            'Ohne Window Scaling kann TCP höchstens 64 KB unbestätigt unterwegs haben. Bei spürbarer Latenz begrenzt das den Durchsatz einer Verbindung stark, unabhängig von der verfügbaren Bandbreite.',
          evidence: [
            'Window Scaling ist nur aktiv, wenn beide Seiten die Option im SYN bzw. SYN/ACK senden.',
            'Theoretisches Maximum pro Verbindung = 64 KB ÷ RTT (z. B. 20 ms → ca. 26 Mbit/s, 100 ms → ca. 5 Mbit/s).',
          ],
          table: { columns: ['Verbindung', 'Client bietet Scaling', 'Server bietet Scaling', 'max. Durchsatz (64 KB/RTT)'], rows },
          causes: [
            'Eine Firewall, ein Proxy oder Load Balancer entfernt TCP-Optionen aus dem Handshake (z. B. „TCP normalization“, SYN-Proxy).',
            'Window Scaling ist im Betriebssystem deaktiviert (Windows: Auto-Tuning „disabled“, Linux: net.ipv4.tcp_window_scaling = 0).',
            'Sehr alte Systeme oder Embedded-Geräte ohne Unterstützung.',
          ],
          actions: [
            'Mitschnitt direkt an Client und Server vergleichen: Ist die Option beim Absender im SYN vorhanden und fehlt beim Empfänger, entfernt sie ein Gerät dazwischen.',
            'Windows: „netsh int tcp set global autotuninglevel=normal“. Linux: „sysctl net.ipv4.tcp_window_scaling=1“.',
            'Firewall/Load-Balancer-Profile auf TCP-Option-Stripping bzw. SYN-Cookie/SYN-Proxy-Modus prüfen.',
          ],
          filter: 'tcp.window_size_scalefactor == -2',
          frames: (bigNoScale.length ? bigNoScale : scalingOff).slice(0, 12).map((c) => c.firstNo),
          weight: scalingOff.length,
        }),
      );
    }
    if (tot.winFull >= 10) {
      const dirs = [];
      for (const c of conns) for (let i = 0; i < 2; i++) if (c.dirs[i].winFull) dirs.push({ c, i, d: c.dirs[i] });
      dirs.sort((a, b) => b.d.winFull - a.d.winFull);
      findings.push(
        finding({
          id: 'tcp.window_full',
          severity: 'info',
          category: 'TCP',
          title: 'Durchsatz durch Empfangsfenster begrenzt (Window Full)',
          summary:
            'Sender haben das vom Empfänger angebotene Fenster vollständig ausgeschöpft und mussten auf Bestätigungen warten. Der Durchsatz wird hier vom Empfänger begrenzt, nicht von der Leitung.',
          evidence: [`${fmtInt(tot.winFull)} „Window Full“-Ereignisse.`],
          table: {
            columns: ['Sender', 'Empfänger', 'Window Full', 'max. Fenster des Empfängers'],
            rows: dirs.slice(0, 10).map(({ c, i, d }) => [endpoint(d.ip, d.port), endpoint(c.dirs[1 - i].ip, c.dirs[1 - i].port), fmtInt(d.winFull), fmtBytes(c.dirs[1 - i].maxWin)]),
          },
          causes: [
            'Empfangspuffer des Empfängers ist kleiner als das Bandbreite-Verzögerungs-Produkt (Bandbreite × RTT).',
            'Window Scaling fehlt oder ist gering; Autotuning ist eingeschränkt.',
            'Die Empfänger-Anwendung liest Daten nur langsam (siehe auch Zero Window).',
          ],
          actions: [
            'Benötigtes Fenster abschätzen: Ziel-Durchsatz (Bit/s) × RTT (s) ÷ 8. Bei 100 Mbit/s und 40 ms sind das ca. 500 KB.',
            'Receive-Buffer bzw. Autotuning auf dem Empfänger prüfen und erhöhen.',
            'Bei Dateiübertragungen über WAN: Protokoll mit mehreren parallelen Streams oder WAN-Optimierung erwägen.',
          ],
          filter: 'tcp.analysis.window_full',
          frames: this.ex.WIN_FULL.list,
          weight: tot.winFull,
        }),
      );
    }

    // 7. Connection setup failures --------------------------------------------
    const attempts = conns.filter((c) => c.synSeen);
    const noResp = attempts.filter((c) => c.state === 'no-response');
    const refused = attempts.filter((c) => c.state === 'refused');
    if (noResp.length) {
      const groups = groupBy(noResp, (c) => endpoint(c.dirs[1 - c.client].ip, c.dirs[1 - c.client].port));
      const ratio = noResp.length / attempts.length;
      findings.push(
        finding({
          id: 'tcp.syn_no_response',
          severity: noResp.length >= 3 && ratio >= 0.1 ? 'critical' : 'warning',
          category: 'Verbindungsaufbau',
          title: `${fmtInt(noResp.length)} Verbindungsversuch${noResp.length === 1 ? '' : 'e'} ohne Antwort`,
          summary:
            'Auf SYN-Pakete kam weder ein SYN/ACK noch ein RST. Typisch ist, dass eine Firewall die Pakete stillschweigend verwirft oder das Ziel nicht erreichbar ist. Für den Nutzer äußert sich das als lange Wartezeit (Timeout nach 20–75 Sekunden).',
          evidence: [
            `${fmtInt(noResp.length)} von ${fmtInt(attempts.length)} Verbindungsversuchen (${fmtPct(ratio, 0)}) ${noResp.length === 1 ? 'blieb' : 'blieben'} unbeantwortet.`,
            `SYN-Wiederholungen insgesamt: ${fmtInt(noResp.reduce((s, c) => s + Math.max(0, c.dirs[c.client].synCount - 1), 0))}.`,
          ],
          table: {
            columns: ['Ziel', 'Dienst', 'Versuche', 'Clients'],
            rows: groups.slice(0, 12).map(([k, list]) => [k, serviceLabel('tcp', list[0].dirs[1 - list[0].client].port), fmtInt(list.length), [...new Set(list.map((c) => c.dirs[c.client].ip))].slice(0, 3).join(', ')]),
          },
          causes: [
            'Firewall/ACL/Security Group verwirft den Verkehr (DROP statt REJECT) – auch Host-Firewall auf dem Zielsystem.',
            'Zielsystem ist ausgeschaltet, nicht im Netz oder die IP-Adresse ist falsch (veralteter DNS-Eintrag).',
            'Routing-Problem: Rückroute fehlt oder das SYN/ACK nimmt einen anderen Weg (asymmetrisches Routing durch eine Stateful Firewall).',
            'Dienst-Port wird von einem Gerät dazwischen gefiltert (Provider, Proxy-Zwang).',
          ],
          actions: [
            'Von der Quelle aus testen: „Test-NetConnection <ziel> -Port <port>“ (PowerShell) bzw. „nc -vz <ziel> <port>“.',
            'Firewall-Logs aller Geräte auf dem Pfad nach Drops für Quelle/Ziel/Port durchsuchen.',
            'Auf dem Zielsystem prüfen, ob der Dienst lauscht („netstat -ano | findstr LISTEN“, „ss -ltnp“) und ob die Host-Firewall ihn freigibt.',
            'Routing in beiden Richtungen prüfen (traceroute/tracert, „tcptraceroute“ auf den Ziel-Port).',
            'Prüfen, ob die Ziel-IP noch stimmt (DNS-Auflösung, Hosts-Datei).',
          ],
          filter: 'tcp.flags.syn == 1 && tcp.flags.ack == 0 && tcp.analysis.retransmission',
          frames: noResp.slice(0, 12).map((c) => c.dirs[c.client].synNo),
          weight: noResp.length * 10,
        }),
      );
    }
    if (refused.length) {
      const groups = groupBy(refused, (c) => endpoint(c.dirs[1 - c.client].ip, c.dirs[1 - c.client].port));
      findings.push(
        finding({
          id: 'tcp.refused',
          severity: refused.length >= 3 ? 'warning' : 'info',
          category: 'Verbindungsaufbau',
          title: `${fmtInt(refused.length)} Verbindung${refused.length === 1 ? '' : 'en'} abgelehnt (RST auf SYN)`,
          summary: 'Das Ziel hat den Verbindungsaufbau sofort mit RST abgelehnt („Connection refused“). Der Host ist erreichbar, aber auf dem Port lauscht kein Dienst oder eine Firewall lehnt aktiv ab.',
          evidence: [`${plural(refused.length, 'Verbindungsversuch wurde', 'Verbindungsversuche wurden')} mit RST beantwortet.`],
          table: {
            columns: ['Ziel', 'Dienst', 'Ablehnungen', 'Clients'],
            rows: groups.slice(0, 12).map(([k, list]) => [k, serviceLabel('tcp', list[0].dirs[1 - list[0].client].port), fmtInt(list.length), [...new Set(list.map((c) => c.dirs[c.client].ip))].slice(0, 3).join(', ')]),
          },
          causes: [
            'Der Dienst läuft nicht (abgestürzt, nicht gestartet) oder lauscht auf einem anderen Port bzw. nur auf localhost.',
            'Falscher Port in der Client-Konfiguration.',
            'Firewall oder Load Balancer lehnt mit TCP-Reset ab (REJECT-Regel, kein gesundes Backend im Pool).',
            'Port-Scan oder Dienstsuche (viele verschiedene Ports → siehe Sicherheitsbefunde).',
          ],
          actions: [
            'Auf dem Zielsystem prüfen, ob der Dienst läuft und auf der richtigen Adresse lauscht („ss -ltnp“, „netstat -ano“).',
            'Client-Konfiguration (Port, Hostname) mit der Server-Konfiguration abgleichen.',
            'Bei Load Balancern: Health-Checks und Pool-Status prüfen.',
          ],
          filter: frameFilter(refused.slice(0, 20).map((c) => c.rstNo)),
          frames: refused.slice(0, 12).map((c) => c.rstNo),
          weight: refused.length * 5,
        }),
      );
    }
    if (attempts.length && !noResp.length && !refused.length) {
      checks.push(check('Verbindungsaufbau', 'TCP-Verbindungsaufbau', attempts.length === 1 ? '1 Versuch, erfolgreich' : `${fmtInt(attempts.length)} Versuche, alle erfolgreich`));
    }

    // 8. SYN retransmissions that eventually succeeded -------------------------
    const slowSyn = attempts.filter((c) => c.synAckSeen && c.dirs[c.client].synCount > 1);
    if (slowSyn.length) {
      findings.push(
        finding({
          id: 'tcp.syn_retry',
          severity: slowSyn.length >= 3 ? 'warning' : 'info',
          category: 'Verbindungsaufbau',
          title: `Verbindungsaufbau erst nach SYN-Wiederholung (${fmtInt(slowSyn.length)}×)`,
          summary: 'Das erste SYN blieb unbeantwortet, erst eine Wiederholung war erfolgreich. Jede Wiederholung kostet 1 bis 3 Sekunden Wartezeit beim Verbindungsaufbau.',
          table: {
            columns: ['Verbindung', 'SYN gesendet', 'Wartezeit bis SYN/ACK'],
            rows: slowSyn.slice(0, 10).map((c) => [label(c), `${c.dirs[c.client].synCount}×`, fmtTime(c.synAckDelay)]),
          },
          causes: [
            'Paketverlust auf dem Weg zum Server oder zurück.',
            'Server-Backlog voll (zu viele gleichzeitige Verbindungsaufbauten, SYN-Flood-Schutz greift).',
            'Firewall/IPS mit Rate-Limit für neue Verbindungen, oder eine Firewall muss erst eine Session anlegen (z. B. nach Failover).',
          ],
          actions: [
            'Server: Listen-Backlog und „SYN backlog“/SYN-Cookies prüfen (Linux: „netstat -s | grep -i listen“, net.core.somaxconn).',
            'Rate-Limits und Connection-Limits auf Firewall/Load Balancer prüfen.',
            'Paketverlust auf dem Pfad prüfen (siehe Retransmissions).',
          ],
          filter: 'tcp.flags.syn == 1 && tcp.analysis.retransmission',
          frames: this.ex.SYN_RETRANS.list,
          weight: slowSyn.length,
        }),
      );
    }

    // 9. Resets ---------------------------------------------------------------
    const abrupt = conns.filter((c) => c.rstDir !== null && c.rstAbrupt);
    const ttlRst = conns.filter((c) => c.rstDir !== null && c.rstTtlAnomaly && !c.rstAfterSynOnly);
    if (abrupt.length || ttlRst.length) {
      const list = [...new Set([...ttlRst, ...abrupt])];
      const rows = list.slice(0, 12).map((c) => {
        const by = c.dirs[c.rstDir];
        const role = c.client === null ? '' : c.rstDir === c.client ? ' (Client)' : ' (Server)';
        return [label(c), `${by.ip}${role}`, fmtTime(c.rstTs - c.firstTs), c.rstTtlAnomaly ? `${c.rstTtl} statt ${by.ttl}` : '–'];
      });
      const evidence = [`${plural(abrupt.length, 'Verbindung wurde', 'Verbindungen wurden')} mit RST abgebrochen, während noch Daten unterwegs bzw. unbestätigt waren.`];
      if (ttlRst.length) {
        evidence.push(
          `Bei ${fmtInt(ttlRst.length)} RST-Paketen weicht die IP-TTL von den übrigen Paketen desselben Absenders ab. Diese RSTs stammen sehr wahrscheinlich nicht vom Endgerät, sondern von einem Gerät dazwischen (Firewall, IPS, Proxy).`,
        );
      }
      const servers = groupBy(list, (c) => (c.rstDir === c.serverIdx ? 'server' : 'client'));
      const serverCount = (servers.find(([k]) => k === 'server') || [null, []])[1].length;
      findings.push(
        finding({
          id: 'tcp.resets',
          severity: ttlRst.length || abrupt.length >= 3 ? 'warning' : 'info',
          category: 'TCP',
          title: ttlRst.length ? `Verbindungen werden zurückgesetzt – vermutlich durch Firewall/IPS` : `${plural(abrupt.length, 'Verbindungsabbruch', 'Verbindungsabbrüche')} durch RST`,
          summary: ttlRst.length
            ? 'Verbindungen wurden per TCP-Reset beendet, und die RST-Pakete tragen eine andere TTL als der restliche Verkehr dieses Absenders. Das ist das typische Merkmal von RSTs, die ein Sicherheitsgerät im Namen eines Endpunkts sendet.'
            : 'Verbindungen wurden mitten im Datenaustausch hart per RST beendet. Für Anwendungen bedeutet das Fehler wie „Connection reset by peer“ oder abgebrochene Downloads.',
          evidence: [...evidence, `RST gesendet von: Server ${fmtInt(serverCount)}× · Client ${fmtInt(list.length - serverCount)}×.`],
          table: { columns: ['Verbindung', 'RST gesendet von', 'nach', 'TTL-Abweichung'], rows },
          causes: [
            'Firewall, IPS oder Web-Proxy beendet die Sitzung (Policy-Verstoß, erkannte Signatur, URL-/App-Filter).',
            'Idle-Timeout einer Firewall/NAT ist abgelaufen; ein späteres Paket passt zu keiner Session mehr.',
            'Anwendung ist abgestürzt oder hat den Socket hart geschlossen (SO_LINGER 0, Prozess-Abbruch).',
            'Load Balancer hat das Backend als „down“ markiert oder Verbindungs-Limit erreicht.',
            'Der Client bricht bewusst ab (Benutzer hat abgebrochen, Timeout in der Anwendung).',
          ],
          actions: [
            'Logs von Firewall/IPS/Proxy zum Zeitpunkt nach Session-Ende-Grund durchsuchen (z. B. „TCP reset-I/-O“, „threat“, „policy deny“).',
            'Idle-Timeouts der Firewall mit TCP-Keepalive-Intervallen der Anwendung abgleichen (Keepalive kürzer als Timeout einstellen).',
            'Anwendungs-Logs auf beiden Seiten zum Zeitpunkt prüfen (Exceptions, Timeouts).',
            'Bei abweichender TTL: Mitschnitt direkt am Server wiederholen – sendet der Server das RST dort nicht, kommt es von einem Gerät dazwischen.',
          ],
          filter: 'tcp.flags.reset == 1',
          frames: list.slice(0, 12).map((c) => c.rstNo),
          weight: list.length * 3,
        }),
      );
    }

    // 10. Handshake latency -----------------------------------------------------
    const withRtt = conns.filter((c) => c.irtt !== null && c.irtt >= 0);
    if (withRtt.length) {
      const byServer = groupBy(withRtt, (c) => endpoint(c.dirs[c.serverIdx].ip, c.dirs[c.serverIdx].port));
      const stats = byServer.map(([k, list]) => ({ k, list, s: summarize(list.map((c) => c.irtt)) }));
      const slow = stats.filter((x) => x.s.median >= T.rttInfoMs / 1000).sort((a, b) => b.s.median - a.s.median);
      const all = summarize(withRtt.map((c) => c.irtt));
      if (slow.length) {
        const worst = slow[0].s.median;
        findings.push(
          finding({
            id: 'tcp.high_latency',
            severity: worst >= T.rttWarnMs / 1000 ? 'warning' : 'info',
            category: 'Latenz',
            title: `Hohe Netzwerklatenz zu ${slow.length === 1 ? slow[0].k : `${slow.length} Zielen`} (bis ${fmtTime(worst)})`,
            summary:
              'Gemessen wurde die Dauer des TCP-Handshakes (SYN → SYN/ACK → ACK). Sie entspricht einer Netzwerk-Rundreise ohne Anwendungsverarbeitung. Jede Anfrage-Antwort-Folge kostet mindestens diese Zeit.',
            evidence: [
              `Median über alle ${fmtInt(withRtt.length)} Verbindungen: ${fmtTime(all.median)}, 90 %-Wert: ${fmtTime(all.p90)}.`,
              'Richtwerte: im LAN < 1 ms, innerhalb Deutschlands 10–30 ms, Europa ↔ USA 80–120 ms, über VPN/Mobilfunk auch mehr.',
            ],
            table: {
              columns: ['Server', 'Verbindungen', 'Handshake-RTT (Median)', 'Maximum'],
              rows: slow.slice(0, 10).map((x) => [x.k, fmtInt(x.list.length), fmtTime(x.s.median), fmtTime(x.s.max)]),
            },
            causes: [
              'Große geografische Entfernung oder ungünstiges Routing (z. B. Umweg über ein entferntes Rechenzentrum oder einen zentralen VPN-/Proxy-Ausbruchspunkt).',
              'Überlastete Leitung mit vollen Puffern (Bufferbloat) – Latenz steigt nur unter Last.',
              'Langsame Verbindungsannahme durch einen überlasteten Server, SYN-Proxy oder Load Balancer.',
            ],
            actions: [
              'Mit „ping“/„mtr“/„tracert“ prüfen, auf welchem Abschnitt die Latenz entsteht.',
              'Prüfen, ob der Verkehr den erwarteten Weg nimmt (Split-Tunneling beim VPN, nächstgelegener Proxy/CDN-Knoten).',
              'Latenz einmal im Leerlauf und einmal unter Last messen. Steigt sie unter Last deutlich, ist Bufferbloat wahrscheinlich und QoS/SQM schafft Abhilfe.',
            ],
            filter: `tcp.analysis.initial_rtt > ${Math.max(0.1, Math.floor(slow[slow.length - 1].s.median * 10) / 10).toFixed(1)}`,
            frames: slow.slice(0, 12).map((x) => x.list[0].firstNo),
            weight: worst * 100,
          }),
        );
      } else {
        checks.push(check('Latenz', 'Verbindungsaufbau-RTT', withRtt.length === 1 ? fmtTime(all.median) : `Median ${fmtTime(all.median)} über ${fmtInt(withRtt.length)} Verbindungen`));
      }
    }

    // 11. Latency under load (bufferbloat) --------------------------------------
    const bloat = [];
    for (const c of conns) {
      for (let i = 0; i < 2; i++) {
        const d = c.dirs[i];
        if (d.rtt.length < 30) continue;
        const s = summarize(d.rtt);
        if (s.p95 - s.min >= T.bloatMs / 1000 && s.p95 >= 4 * Math.max(s.min, 0.005)) bloat.push({ c, d, s });
      }
    }
    if (bloat.length) {
      bloat.sort((a, b) => b.s.p95 - a.s.p95);
      findings.push(
        finding({
          id: 'tcp.bufferbloat',
          severity: bloat[0].s.p95 >= Math.max(0.5, (T.bloatMs / 1000) * 3) ? 'warning' : 'info',
          category: 'Latenz',
          title: 'Latenz steigt während der Übertragung stark an (Bufferbloat)',
          summary:
            'Die Antwortzeit auf Datensegmente wächst innerhalb einer Verbindung auf ein Vielfaches des Minimums. Typisch für zu große, volle Puffer an einem Engpass: Die Leitung ist voll, und alle anderen Anwendungen (VoIP, Videokonferenz, Web) leiden mit.',
          table: {
            columns: ['Sender', 'RTT minimal', 'RTT Median', 'RTT 95 %', 'Messwerte'],
            rows: bloat.slice(0, 10).map(({ d, s }) => [endpoint(d.ip, d.port), fmtTime(s.min), fmtTime(s.median), fmtTime(s.p95), fmtInt(s.count)]),
          },
          causes: [
            'Engpass (meist Internet-Upload oder VPN) mit großen Puffern im Router/Modem.',
            'Fehlendes oder falsch dimensioniertes Traffic-Shaping.',
            'Große Downloads/Uploads/Backups laufen ohne Bandbreitenbegrenzung.',
          ],
          actions: [
            'Am Engpass Smart Queue Management aktivieren (fq_codel/CAKE) und knapp unter der Leitungsrate shapen.',
            'QoS: Echtzeitverkehr priorisieren, Bulk-Übertragungen (Backups, Updates) begrenzen oder zeitlich verlagern.',
            'Latenz im Leerlauf vs. unter Last messen (z. B. Waveform-/Speedtest mit „loaded latency“).',
          ],
          filter: `tcp.analysis.ack_rtt > ${Math.max(0.1, Math.round(bloat[bloat.length - 1].s.p95 * 10) / 20).toFixed(2)}`,
          frames: bloat.slice(0, 12).map((x) => x.c.firstNo),
          weight: bloat.length,
        }),
      );
    }

    // 12. Slow application responses -------------------------------------------
    const respByServer = new Map();
    for (const c of conns) {
      if (c.respTimes.length < 1) continue;
      const k = endpoint(c.dirs[c.serverIdx].ip, c.dirs[c.serverIdx].port);
      const e = respByServer.get(k) || { k, times: [], rtts: [], conns: 0, ip: c.dirs[c.serverIdx].ip, port: c.dirs[c.serverIdx].port };
      e.times.push(...c.respTimes);
      if (c.irtt !== null) e.rtts.push(c.irtt);
      e.conns++;
      respByServer.set(k, e);
    }
    const slowApps = [];
    for (const e of respByServer.values()) {
      if (e.times.length < 3) continue;
      const s = summarize(e.times);
      const rtt = e.rtts.length ? summarize(e.rtts).median : null;
      if (s.median >= T.serverInfoSec || (s.p90 >= T.serverWarnSec && s.median >= T.serverInfoSec / 2)) slowApps.push({ ...e, s, rtt });
    }
    if (slowApps.length) {
      slowApps.sort((a, b) => b.s.median - a.s.median);
      findings.push(
        finding({
          id: 'tcp.slow_server',
          severity: slowApps[0].s.median >= T.serverWarnSec ? 'warning' : 'info',
          category: 'Anwendung',
          title: `Langsame Antworten vom Server (${slowApps.length === 1 ? slowApps[0].k : `${slowApps.length} Server`})`,
          summary:
            'Zwischen der letzten Anfrage des Clients und dem ersten Antwortbyte des Servers vergeht viel Zeit. Ist die Netzwerk-Rundreise (Handshake-RTT) dabei klein, liegt die Verzögerung im Server bzw. in der Anwendung dahinter und nicht im Netz.',
          evidence: [
            'Bei Long-Polling, WebSockets, Push-Diensten oder interaktiven Sitzungen sind lange Pausen normal und kein Fehler.',
          ],
          table: {
            columns: ['Server', 'Antwortzeit Median', '90 %', 'Netzwerk-RTT', 'Messungen'],
            rows: slowApps.slice(0, 10).map((e) => [`${e.k} · ${serviceLabel('tcp', e.port)}`, fmtTime(e.s.median), fmtTime(e.s.p90), e.rtt !== null ? fmtTime(e.rtt) : '–', fmtInt(e.s.count)]),
          },
          causes: [
            'Server ist ausgelastet (CPU, Speicher, Threads/Worker erschöpft).',
            'Langsame Backend-Abhängigkeiten: Datenbank-Abfragen, externe APIs, Authentifizierung (LDAP/Kerberos), DNS-Lookups des Servers.',
            'Sperren/Locks in der Anwendung oder Datenbank.',
          ],
          actions: [
            'Server-Metriken (CPU, RAM, Disk-I/O, Thread-Pools) zum Zeitpunkt prüfen.',
            'Anwendungs-/APM-Traces und Datenbank-Slow-Query-Logs auswerten.',
            'Mitschnitt auf dem Server zwischen Server und Backend (Datenbank etc.) wiederholen, um die langsame Abhängigkeit zu finden.',
          ],
          filter: `${addrFilter(slowApps[0].ip)} && tcp.port == ${slowApps[0].port}`,
          weight: slowApps[0].s.median * 10,
        }),
      );
    }

    // 13. PMTU black hole suspicion ---------------------------------------------
    const pmtu = [];
    for (const c of conns) {
      for (let i = 0; i < 2; i++) {
        const d = c.dirs[i];
        if (d.largeRetrans >= 2 && !d.largeAcked && d.maxLen >= LARGE_SEGMENT) pmtu.push({ c, d });
      }
    }
    if (pmtu.length) {
      findings.push(
        finding({
          id: 'tcp.pmtu_blackhole',
          severity: 'critical',
          category: 'MTU',
          title: 'Verdacht auf MTU-Problem (große Pakete kommen nicht an)',
          summary:
            'In diesen Verbindungen werden große Segmente immer wieder gesendet, aber nie bestätigt, während kleine Pakete durchkommen. Das ist das typische Bild eines PMTU-Blackholes: Auf dem Weg ist die MTU kleiner, und die Fehlermeldung „Fragmentation needed“ (ICMP) erreicht den Sender nicht.',
          evidence: ['Symptome für Nutzer: Verbindung wird aufgebaut, Login klappt, aber Seiten/Dateien laden nicht oder hängen; kleine Anfragen funktionieren.'],
          table: {
            columns: ['Sender', 'Empfänger', 'größtes Segment', 'Wiederholungen großer Segmente', 'MSS (Sender/Empfänger)'],
            rows: pmtu.slice(0, 10).map(({ c, d }) => {
              const o = c.dirs[0] === d ? c.dirs[1] : c.dirs[0];
              return [endpoint(d.ip, d.port), endpoint(o.ip, o.port), `${fmtInt(d.maxLen)} B`, fmtInt(d.largeRetrans), `${d.mss ?? '–'} / ${o.mss ?? '–'}`];
            }),
          },
          causes: [
            'Tunnel auf dem Weg (IPsec, GRE, VXLAN, PPPoE, WireGuard/OpenVPN) reduziert die MTU, ohne dass die MSS angepasst wird.',
            'ICMP „Fragmentation needed“/„Packet too big“ wird von einer Firewall blockiert, Path MTU Discovery funktioniert dadurch nicht.',
            'Unterschiedliche MTU-Einstellungen im selben Netz (z. B. Jumbo Frames auf einer Seite).',
          ],
          actions: [
            'MTU testen: „ping -f -l 1472 <ziel>“ (Windows) bzw. „ping -M do -s 1472 <ziel>“ (Linux), Größe schrittweise verringern, bis es klappt.',
            'Auf dem Tunnel-/Edge-Router TCP-MSS-Clamping aktivieren (z. B. „ip tcp adjust-mss 1360“ bzw. „--clamp-mss-to-pmtu“).',
            'ICMP Typ 3 Code 4 (IPv4) bzw. ICMPv6 Typ 2 (Packet Too Big) in allen Firewalls erlauben.',
            'MTU-Einstellungen der beteiligten Interfaces vereinheitlichen.',
          ],
          filter: `tcp.len >= ${LARGE_SEGMENT} && tcp.analysis.retransmission`,
          frames: pmtu.slice(0, 12).map((x) => x.c.problemFrames[0] ?? x.c.firstNo),
          weight: 1000,
        }),
      );
    }

    // 14. Small MSS (tunnel) ----------------------------------------------------
    const mssVals = new Map();
    for (const c of conns) for (const d of c.dirs) if (d.mss) mssVals.set(d.mss, (mssVals.get(d.mss) || 0) + 1);
    const smallMss = [...mssVals.entries()].filter(([m]) => m < 1300 && m >= 100);
    if (smallMss.length) {
      findings.push(
        finding({
          id: 'tcp.small_mss',
          severity: 'info',
          category: 'MTU',
          title: 'Verkleinerte TCP-MSS erkannt (Tunnel/VPN auf dem Weg)',
          summary: 'Einige Systeme handeln eine kleinere maximale Segmentgröße aus als im Ethernet üblich (1460 bei IPv4, 1440 bei IPv6). Das ist meist gewollt (VPN, PPPoE, MSS-Clamping) und nur ein Hinweis.',
          evidence: [`Beobachtete MSS-Werte: ${[...mssVals.entries()].sort((a, b) => b[1] - a[1]).map(([m, n]) => `${m} (${n}×)`).join(', ')}.`],
          causes: ['VPN/IPsec/GRE-Tunnel mit MSS-Clamping', 'PPPoE-Anschluss (MSS 1452)', 'Bewusst reduzierte Interface-MTU'],
          actions: ['Nur relevant, wenn gleichzeitig Übertragungen hängen: dann MTU entlang des Pfads prüfen (siehe MTU-Befunde).'],
          filter: 'tcp.options.mss_val < 1300',
        }),
      );
    }

    // 15. Segments larger than MSS -> offload ----------------------------------
    if (this.offloadSegs.count) {
      findings.push(
        finding({
          id: 'capture.offload',
          severity: 'info',
          category: 'Mitschnitt',
          title: 'Mitschnitt enthält Riesen-Segmente (Segmentation Offload)',
          summary:
            'Es wurden TCP-Segmente größer als die ausgehandelte MSS aufgezeichnet. Der Mitschnitt entstand also auf einem Host, dessen Netzwerkkarte die Segmentierung übernimmt (TSO/GSO/LRO). Auf der Leitung sahen die Pakete anders aus. Das ist kein Fehler, aber Paketgrößen und Zeitabstände sind dadurch nicht wirklichkeitsgetreu.',
          evidence: [`${fmtInt(this.offloadSegs.count)} Segmente größer als MSS.`],
          causes: ['Mitschnitt direkt auf Client oder Server mit aktivem TCP Segmentation Offload / Large Receive Offload.'],
          actions: ['Für exakte Analysen auf der Leitung mitschneiden (TAP/SPAN) oder Offloading testweise deaktivieren („ethtool -K eth0 tso off gso off gro off“).'],
          filter: 'frame.len > 1518',
          frames: this.offloadSegs.list,
        }),
      );
    }

    // Connection table for the UI
    const table = conns.map((c) => this.summaryRow(c));
    this.result = {
      findings,
      checks,
      conns: table,
      stats: {
        connections: conns.length,
        segments: this.segments,
        dataSegments: dataSegs,
        retransRate: rate,
        ...tot,
        handshakes: withRtt.length,
        medianIrtt: withRtt.length ? summarize(withRtt.map((c) => c.irtt)).median : null,
        failed: noResp.length + refused.length,
        resets: conns.filter((c) => c.rstDir !== null).length,
      },
    };
    return this.result;
  }

  classify(c, captureEnd) {
    if (c.synSeen && !c.synAckSeen) {
      if (c.rstDir !== null && c.rstDir !== c.client) return 'refused';
      const cd = c.dirs[c.client];
      if (cd.synCount > 1 || captureEnd - cd.synTs >= 3) return 'no-response';
      return 'pending';
    }
    if (c.rstDir !== null) return c.rstAbrupt ? 'reset' : 'closed-rst';
    if (c.dirs[0].fin && c.dirs[1].fin) return 'closed';
    if (c.dirs[0].fin || c.dirs[1].fin) return 'half-closed';
    if (!c.synSeen && !c.synAckSeen) return 'mid-stream';
    return 'open';
  }

  summaryRow(c) {
    const cl = c.client ?? (c.serverIdx === 0 ? 1 : 0);
    const a = c.dirs[cl];
    const b = c.dirs[1 - cl];
    const dur = Math.max(0, c.lastTs - c.firstTs);
    const payload = a.payload + b.payload;
    const retrans = a.retrans + b.retrans;
    const dataSegs = a.dataSegs + b.dataSegs;
    const rtts = [...a.rtt, ...b.rtt];
    const rttS = rtts.length ? summarize(rtts) : null;
    const resp = c.respTimes.length ? summarize(c.respTimes) : null;
    const issues = [];
    if (c.state === 'no-response') issues.push('keine Antwort');
    if (c.state === 'refused') issues.push('abgelehnt');
    if (c.state === 'reset') issues.push('RST-Abbruch');
    if (c.rstTtlAnomaly) issues.push('RST von Middlebox?');
    if (retrans && dataSegs && retrans / dataSegs >= 0.01) issues.push(`${fmtPct(retrans / dataSegs, 1)} Retrans.`);
    if (a.zeroWin + b.zeroWin) issues.push('Zero Window');
    if (c.scaleKnown && c.noScaling) issues.push('kein Window Scaling');
    if (a.largeRetrans >= 2 && !a.largeAcked) issues.push('MTU?');
    if (b.largeRetrans >= 2 && !b.largeAcked) issues.push('MTU?');

    const n = flows.get(k).n;
    vote(src, dir === 'AB' ? 'A' : 'B', n);
    vote(dst, dir === 'AB' ? 'B' : 'A', n);
  }
  // One-directional flows (e.g. a UDP stream): decide by delay once the offset is known.
  if (clockOffset !== null) {
    for (const [k, f] of flows) {
      if (flowDir.has(k)) continue;
      const lat = median(f.d) - clockOffset;
      if (Math.abs(lat) < 0.0005) continue;
      flowDir.set(k, lat > 0 ? 'AB' : 'BA');
      const [, src, , dst] = k.split('|');
      vote(src, lat > 0 ? 'A' : 'B', f.n);
      vote(dst, lat > 0 ? 'B' : 'A', f.n);
    }
  }
  const side = (ip) => {
    const v = votes.get(ip);
    if (!v) return null;
    return v.A > v.B * 2 ? 'A' : v.B > v.A * 2 ? 'B' : null;
  };
  const dirOf = (proto, src, sport, dst, dport) => {
    const k = flowKey(proto, src, sport, dst, dport);
    if (flowDir.has(k)) return flowDir.get(k);
    const s = side(src);
    const d = side(dst);
    if (s === 'A' && d === 'B') return 'AB';
    if (s === 'B' && d === 'A') return 'BA';
    return null;
  };

  // NAT: B endpoints back to A addressing.
  const epMap = new Map();
  const hostMap = new Map();
  for (const a of A) {
    if (a.m < 0) continue;
    const b = B[a.m];
    epMap.set(`${b.proto}|${b.src}|${b.sport}`, [a.src, a.sport]);
    epMap.set(`${b.proto}|${b.dst}|${b.dport}`, [a.dst, a.dport]);
    for (const [bi, ai] of [
      [b.src, a.src],
      [b.dst, a.dst],
    ]) {
      const s = hostMap.get(bi);
      if (s === undefined) hostMap.set(bi, ai);
      else if (s !== ai) hostMap.set(bi, null); // one B address for several A hosts (masquerade)
    }
  }
  const toA = (proto, ip, port) => {
    const e = epMap.get(`${proto}|${ip}|${port}`);
    if (e) return e;
    const h = hostMap.get(ip);
    return [h || ip, port];
  };

  // --- common time range ------------------------------------------------------------
  const off = clockOffset ?? (rough ? rough.offset : 0);
  const from0 = Math.max(sa.start ?? 0, (sb.start ?? 0) - off);
  const to0 = Math.min(sa.end ?? 0, (sb.end ?? 0) - off);
  const guard = Math.min(GUARD, Math.max(0, to0 - from0) * 0.05); // short captures keep most of their time
  const from = from0 + guard;
  const to = to0 - guard;
  const inA = (r) => r.ts >= from && r.ts <= to;
  const inB = (r) => r.ts - off >= from && r.ts - off <= to;

  // --- conversations, losses, packets created on the way ---------------------------------
  const convs = new Map();
  const conv = (proto, src, sport, dst, dport) => {
    const x = `${src}|${sport ?? ''}`;
    const y = `${dst}|${dport ?? ''}`;
    const key = `${proto}|${x < y ? `${x}|${y}` : `${y}|${x}`}`;
    let c = convs.get(key);
    if (!c) {
      convs.set(key, (c = { key, proto, a: [src, sport], b: [dst, dport], natB: null, sentAB: 0, lostAB: 0, sentBA: 0, lostBA: 0, createdAB: 0, createdBA: 0, onlyA: 0, onlyB: 0, matched: 0, lostFramesA: [], lostFramesB: [], createdFramesA: [], createdFramesB: [], lostRecs: { AB: [], BA: [] }, createdRecs: { AB: [], BA: [] }, synOnly: true, firstTs: null }));
    }
    return c;
  };
  const unknownA = [];
  const unknownB = [];
  const lat = { AB: [], BA: [] };
  for (const a of A) {
    if (!inA(a)) continue;
    const dir = dirOf(a.proto, a.src, a.sport, a.dst, a.dport);
    const c = conv(a.proto, a.src, a.sport, a.dst, a.dport);
    if (c.firstTs === null) {
      c.firstTs = a.ts;
      // orient the conversation in travel direction A -> B when known
      if (dir === 'BA') {
        c.a = [a.dst, a.dport];
        c.b = [a.src, a.sport];
      }
    }
    if (!(a.proto === 6 && a.flags & TCP_SYN && !(a.flags & TCP_ACK))) c.synOnly = false;
    if (a.m >= 0) {
      c.matched++;
      const b = B[a.m];
      if (dir === 'AB') {
        c.sentAB++;
        if (clockOffset !== null) lat.AB.push(b.ts - a.ts - clockOffset);
      } else if (dir === 'BA') {
        c.sentBA++;
        if (clockOffset !== null) lat.BA.push(a.ts - (b.ts - clockOffset));
      }
      if (c.natB === null && (a.src !== b.src || a.dst !== b.dst || a.sport !== b.sport || a.dport !== b.dport)) c.natB = dir === 'BA' ? [b.dst, b.dport, b.src, b.sport] : [b.src, b.sport, b.dst, b.dport];
      continue;
    }
    c.onlyA++;
    if (dir === 'AB') {
      c.sentAB++;
      c.lostAB++;
      c.lostRecs.AB.push(a);
      if (c.lostFramesA.length < 12) c.lostFramesA.push(a.no);
    } else if (dir === 'BA') {
      c.createdBA++;
      c.createdRecs.BA.push(a);
      if (c.createdFramesA.length < 12) c.createdFramesA.push(a.no);
    } else unknownA.push(a);
  }
  for (const b of B) {
    if (b.m >= 0 || !inB(b)) continue;
    const [src, sport] = toA(b.proto, b.src, b.sport);
    const [dst, dport] = toA(b.proto, b.dst, b.dport);
    const dir = dirOf(b.proto, src, sport, dst, dport);
    const c = conv(b.proto, src, sport, dst, dport);
    if (c.firstTs === null) {
      c.firstTs = b.ts - off;
      if (dir === 'BA') {
        c.a = [dst, dport];
        c.b = [src, sport];
      }
    }
    if (!(b.proto === 6 && b.flags & TCP_SYN && !(b.flags & TCP_ACK))) c.synOnly = false;
    c.onlyB++;
    if (dir === 'BA') {
      c.sentBA++;
      c.lostBA++;
      c.lostRecs.BA.push(b);
      if (c.lostFramesB.length < 12) c.lostFramesB.push(b.no);
    } else if (dir === 'AB') {
      c.createdAB++;
      c.createdRecs.AB.push(b);
      if (c.createdFramesB.length < 12) c.createdFramesB.push(b.no);
    } else unknownB.push(b);
  }

  // --- what the path changes -----------------------------------------------------------
  const ttl = { AB: new Map(), BA: new Map() };
  const dscp = { AB: new Map(), BA: new Map() };
  const ecn = { AB: 0, BA: 0 };
  const mss = [];
  const stripped = new Map();
  const seqShift = new Map();
  let pairsAB = 0;
  let pairsBA = 0;
  for (const a of A) {
    if (a.m < 0) continue;
    const b = B[a.m];
    const dir = dirOf(a.proto, a.src, a.sport, a.dst, a.dport);
    if (!dir) continue;
    const [up, down] = dir === 'AB' ? [a, b] : [b, a]; // before / after the path
    if (dir === 'AB') pairsAB++;
    else pairsBA++;
    const hops = up.ttl - down.ttl;
    ttl[dir].set(hops, (ttl[dir].get(hops) || 0) + 1);
    if (up.dscp !== down.dscp) {
      const k = `${up.dscp}→${down.dscp}`;
      dscp[dir].set(k, (dscp[dir].get(k) || 0) + 1);
    }
    if (up.ecn !== down.ecn) ecn[dir]++;
    if (a.proto === 6 && a.flags & TCP_SYN) {
      if (up.mss !== down.mss) mss.push({ dir, from: up.mss, to: down.mss, conv: `${endpoint(a.src, a.sport)} → ${endpoint(a.dst, a.dport)}` });
      for (const [name, has] of [
        ['Window Scaling', (r) => r.ws !== null],
        ['SACK', (r) => r.sackPerm],
        ['Timestamps', (r) => r.tsOpt],
      ]) {
        if (has(up) && !has(down)) {
          const k = `${dir}|${name}`;
          stripped.set(k, (stripped.get(k) || 0) + 1);
        }
      }
    }
    if (a.proto === 6 && a.seq !== b.seq && !(a.flags & TCP_RST)) {
      const k = recFlow(a);
      const delta = (b.seq - a.seq) >>> 0;
      const s = seqShift.get(k);
      if (!s) seqShift.set(k, { delta, n: 1, consistent: true, label: `${endpoint(a.src, a.sport)} → ${endpoint(a.dst, a.dport)}` });
      else {
        s.n++;
        if (s.delta !== delta) s.consistent = false;
      }
    }
  }

  // --- findings -----------------------------------------------------------------------
  const L = { A: labels[0], B: labels[1] };
  const pathAB = `${L.A} → ${L.B}`;
  const pathBA = `${L.B} → ${L.A}`;
  const findings = [];
  const checks = [];
  const dropsNote = sa.drops || sb.drops ? `Der Mitschnitt selbst meldet verworfene Pakete (${L.A}: ${fmtInt(sa.drops)}, ${L.B}: ${fmtInt(sb.drops)}) – ein Teil der „Verluste“ kann daher von der Aufzeichnung stammen.` : null;
  const convList = [...convs.values()];
  const convName = (c) => `${endpoint(c.a[0], c.a[1])} → ${endpoint(c.b[0], c.b[1])}`;
  const natName = (c) => (c.natB ? `${endpoint(c.natB[0], c.natB[1])} → ${endpoint(c.natB[2], c.natB[3])}` : '');

  if (!matched) {
    findings.push(
      finding({
        id: 'compare.no_match',
        severity: 'critical',
        category: 'Vergleich',
        title: 'Die beiden Mitschnitte haben keine gemeinsamen Pakete',
        summary: `Kein Paket aus ${L.A} findet sich in ${L.B} wieder. Ein Vergleich ist so nicht möglich.`,
        evidence: [`${L.A}: ${plural(A.length, 'IP-Paket', 'IP-Pakete')}, ${sa.first !== null ? new Date(sa.first * 1000).toLocaleString('de-DE') : '–'} bis ${sa.last !== null ? new Date(sa.last * 1000).toLocaleString('de-DE') : '–'}`, `${L.B}: ${plural(B.length, 'IP-Paket', 'IP-Pakete')}, ${sb.first !== null ? new Date(sb.first * 1000).toLocaleString('de-DE') : '–'} bis ${sb.last !== null ? new Date(sb.last * 1000).toLocaleString('de-DE') : '–'}`],
        causes: [
          'Die Mitschnitte stammen aus verschiedenen Zeiträumen.',
          'Der Verkehr läuft zwischen den Messpunkten verschlüsselt durch einen Tunnel (IPsec/ESP, WireGuard, GRE) – dann sieht ein Messpunkt nur den Tunnel.',
          'Die Messpunkte liegen nicht auf demselben Weg (anderes Interface, anderer Pfad, Lastverteilung).',
          'Ein Gerät dazwischen verändert alle Pakete (z. B. Proxy, der Verbindungen neu aufbaut, oder Kompression).',
        ],
        actions: ['Zeitraum beider Mitschnitte prüfen und gleichzeitig neu aufzeichnen.', 'Mit einem Filter auf eine bekannte Verbindung (Host und Port) an beiden Punkten mitschneiden.', 'Bei Tunneln den Mitschnitt innerhalb des Tunnels (entschlüsselte Seite) verwenden.'],
        weight: 100,
      }),
    );
  }

  // Loss is judged on conversations that got through at least partly;
  // conversations that never arrived are blocked or rejected, not lossy.
  const through = convList.filter((c) => c.matched);
  const byTime = (x, y) => x.ts - y.ts;
  const lost = { AB: through.flatMap((c) => c.lostRecs.AB).sort(byTime), BA: through.flatMap((c) => c.lostRecs.BA).sort(byTime) };
  const created = { AB: convList.flatMap((c) => c.createdRecs.AB).sort(byTime), BA: convList.flatMap((c) => c.createdRecs.BA).sort(byTime) };
  const lossRate = (d) => {
    const sent = through.reduce((s, c) => s + (d === 'AB' ? c.sentAB : c.sentBA), 0);
    return { sent, lost: lost[d].length, rate: sent ? lost[d].length / sent : 0 };
  };
  const loss = { AB: lossRate('AB'), BA: lossRate('BA') };
  for (const d of ['AB', 'BA']) {
    const l = loss[d];
    const path = d === 'AB' ? pathAB : pathBA;
    if (!l.sent) continue;
    if (!l.lost) {
      checks.push(check('Vergleich', `Kein Verlust ${path}`, `${fmtInt(l.sent)} Pakete`));
      continue;
    }
    const pct = l.rate * 100;
    const sev = pct >= T.tcpRetransCrit ? 'critical' : pct >= T.tcpRetransWarn ? 'warning' : 'info';
    const lostList = lost[d];
    const big = lostList.filter((r) => r.wire >= 1400).length;
    const sentBig = d === 'AB' ? A.filter((r) => inA(r) && r.wire >= 1400 && dirOf(r.proto, r.src, r.sport, r.dst, r.dport) === 'AB').length : 0;
    const top = through
      .filter((c) => (d === 'AB' ? c.lostAB : c.lostBA))
      .sort((x, y) => (d === 'AB' ? y.lostAB - x.lostAB : y.lostBA - x.lostBA))
      .slice(0, 10);
    const side = d === 'AB' ? L.A : L.B;
    const frames = lostList.slice(0, 12).map((r) => r.no);
    const causes = [
      'Überlastete Leitung oder Warteschlange am Gerät zwischen den Messpunkten (Puffer läuft über, Pakete werden verworfen).',
      'Policer oder Shaper (QoS, Bandbreitenbegrenzung des Providers) verwirft Pakete oberhalb der vereinbarten Rate.',
      'Firewall/IPS verwirft einzelne Pakete (Zustandstabelle voll, Signaturtreffer, ungültiger TCP-Zustand, Rate-Limits).',
      'Physikalische Fehler auf der Strecke (CRC-Fehler, schlechtes Kabel, WLAN-Funkstrecke).',
    ];
    if (big && big / lostList.length > 0.8 && (!sentBig || big / sentBig > 0.5)) causes.unshift('Fast nur große Pakete gehen verloren: Hinweis auf ein MTU-Problem auf der Strecke (Tunnel, PPPoE), bei dem große Pakete verworfen werden.');
    if (dropsNote) causes.push(dropsNote);
    findings.push(
      finding({
        id: `compare.loss_${d.toLowerCase()}`,
        severity: sev,
        category: 'Vergleich',
        title: `Paketverlust ${path}: ${fmtPct(l.rate, 2)}`,
        summary: `${plural(l.lost, 'Paket wurde', 'Pakete wurden')} bei ${side} gesehen, kamen aber nicht bei ${d === 'AB' ? L.B : L.A} an. Der Verlust entsteht also zwischen den beiden Messpunkten.`,
        evidence: [
          `${fmtInt(l.sent)} Pakete in Richtung ${path}, davon ${fmtInt(l.lost)} nicht angekommen (${fmtPct(l.rate, 2)}).`,
          big ? `${fmtInt(big)} der verlorenen Pakete sind 1400 Byte oder größer.` : null,
          `Beispiele in Mitschnitt ${side}: Pakete ${frames.map((n) => `#${n}`).join(' ')}`,
        ].filter(Boolean),
        table: top.length ? { columns: ['Verbindung (Sicht ' + L.A + ')', 'Gesendet', 'Verloren', 'Anteil'], rows: top.map((c) => [convName(c), fmtInt(d === 'AB' ? c.sentAB : c.sentBA), fmtInt(d === 'AB' ? c.lostAB : c.lostBA), fmtPct((d === 'AB' ? c.lostAB / c.sentAB : c.lostBA / c.sentBA) || 0, 1)]) } : null,
        causes,
        actions: [
          'Interface-Zähler (Drops, Discards, CRC) und Warteschlangen der Geräte zwischen den Messpunkten prüfen.',
          'Firewall-/IPS-Logs zum Zeitpunkt der Beispielpakete durchsehen.',
          'Bandbreite und QoS-/Policer-Konfiguration der Strecke prüfen.',
          `In Wireshark (Mitschnitt ${side}) die Beispielpakete mit dem Filter unten markieren.`,
        ],
        filter: frameFilter(frames),
        weight: 80 + pct,
      }),
    );
  }

  const blocked = convList.filter((c) => c.synOnly && c.proto === 6 && !c.matched && (c.lostAB || c.lostBA));
  if (blocked.length) {
    findings.push(
      finding({
        id: 'compare.blocked',
        severity: 'critical',
        category: 'Vergleich',
        title: `${plural(blocked.length, 'Verbindungsaufbau kommt', 'Verbindungsaufbauten kommen')} nicht am anderen Messpunkt an`,
        summary: 'SYN-Pakete wurden auf einer Seite gesehen, kein einziges davon auf der anderen. Ein Gerät zwischen den Messpunkten blockiert diese Verbindungen (oder leitet sie auf einen anderen Weg).',
        evidence: blocked.slice(0, 5).map((c) => `${convName(c)}: ${plural(c.lostAB + c.lostBA, 'SYN', 'SYNs')} ohne Gegenstück`),
        table: { columns: ['Verbindung', 'Dienst', 'SYN-Versuche', 'Pakete (Beispiele)'], rows: blocked.slice(0, 20).map((c) => [convName(c), serviceLabel('tcp', c.b[1]), fmtInt(c.lostAB + c.lostBA), [...c.lostFramesA, ...c.lostFramesB].slice(0, 4).map((n) => `#${n}`).join(' ')]) },
        causes: ['Firewall-Regel oder ACL verwirft den Zielport (Drop ohne Antwort).', 'Routing: Die Pakete verlassen das Gerät über einen anderen Weg als den zweiten Messpunkt.', 'IPS/Geo-Blocking/Reputationsfilter.'],
        actions: ['Regelwerk der Firewall für Ziel und Port prüfen (Hit-Counter, Logs „deny“/„drop“).', 'Routing-Tabelle und Policy-Based-Routing zwischen den Messpunkten prüfen.', 'Packet-Tracer der Firewall mit Quelle, Ziel und Port ausführen.'],
        filter: `tcp.flags.syn == 1 && tcp.flags.ack == 0 && (${blocked
          .slice(0, 5)
          .map((c) => `(${c.b[0].includes(':') ? 'ipv6' : 'ip'}.dst == ${c.b[0]} && tcp.dstport == ${c.b[1]})`)
          .join(' || ')})`,
        weight: 95,
      }),
    );
  }

  for (const d of ['AB', 'BA']) {
    const list = created[d];
    if (!list.length) continue;
    const rst = list.filter((r) => r.proto === 6 && r.flags & TCP_RST).length;
    const icmp = list.filter((r) => r.proto === 1 || r.proto === 58).length;
    const seenAt = d === 'AB' ? L.B : L.A;
    const notAt = d === 'AB' ? L.A : L.B;
    const frames = list.slice(0, 12).map((r) => r.no);
    findings.push(
      finding({
        id: `compare.created_${d.toLowerCase()}`,
        severity: rst || icmp ? 'warning' : 'info',
        category: 'Vergleich',
        title: rst ? `TCP-Resets entstehen zwischen den Messpunkten (${plural(rst, 'RST', 'RSTs')})` : `${plural(list.length, 'Paket entsteht', 'Pakete entstehen')} zwischen den Messpunkten`,
        summary: `Bei ${seenAt} kommen Pakete an, die bei ${notAt} nie vorbeigekommen sind, obwohl sie aus dieser Richtung stammen. Sie wurden unterwegs erzeugt${rst ? ' – typischerweise lehnt eine Firewall oder ein Proxy die Verbindung im Namen des Ziels ab' : ''}.`,
        evidence: [`${plural(list.length, 'Paket', 'Pakete')} nur bei ${seenAt}${rst ? `, davon ${fmtInt(rst)} TCP-RST` : ''}${icmp ? `, ${fmtInt(icmp)} ICMP` : ''}.`, `Beispiele in Mitschnitt ${seenAt}: Pakete ${frames.map((n) => `#${n}`).join(' ')}`],
        causes: rst ? ['Firewall-Regel mit „reject“ (TCP-Reset) statt „drop“.', 'IPS/Proxy beendet die Verbindung (Richtlinie, Inhaltsfilter).', 'Leerlauf-Timeout der Firewall: Sie setzt alte Verbindungen zurück.'] : ['Router/Firewall antwortet selbst (ICMP unreachable, TTL exceeded, Fragmentation needed).', 'Der Mitschnitt an einem Messpunkt hat Pakete verloren (Aufzeichnung überlastet).'],
        actions: ['Firewall-Logs nach „reject“/„reset“ für die betroffene Verbindung durchsuchen.', 'Bei Leerlauf-Abbrüchen Timeout der Firewall mit dem Keep-Alive der Anwendung abstimmen.'],
        filter: frameFilter(frames),
        weight: 70,
      }),
    );
  }

  const natConvs = convList.filter((c) => c.natB);
  if (natConvs.length) {
    const srcNat = natConvs.filter((c) => c.natB[0] !== c.a[0] || c.natB[1] !== c.a[1]).length;
    const dstNat = natConvs.filter((c) => c.natB[2] !== c.b[0] || c.natB[3] !== c.b[1]).length;
    findings.push(
      finding({
        id: 'compare.nat',
        severity: 'info',
        category: 'Vergleich',
        title: `NAT zwischen den Messpunkten (${plural(natConvs.length, 'Verbindung', 'Verbindungen')})`,
        summary: `Adressen oder Ports werden unterwegs umgeschrieben${srcNat ? ' – Quell-NAT' : ''}${srcNat && dstNat ? ' und' : ''}${dstNat ? ' Ziel-NAT/Portweiterleitung' : ''}. Die Tabelle zeigt, wie dieselbe Verbindung an beiden Punkten heißt; in Firewall-Logs taucht sie unter der Adresse hinter dem NAT auf.`,
        table: { columns: [`Bei ${L.A}`, `Bei ${L.B}`], rows: natConvs.slice(0, 20).map((c) => [convName(c), natName(c)]) },
        causes: [],
        actions: ['Bei der Fehlersuche hinter dem NAT nach der umgeschriebenen Adresse filtern.'],
        weight: 10,
      }),
    );
  }

  if (mss.length) {
    const ex = mss[0];
    findings.push(
      finding({
        id: 'compare.mss',
        severity: 'info',
        category: 'Vergleich',
        title: `MSS wird unterwegs angepasst (${ex.from ?? '–'} → ${ex.to ?? '–'} Byte)`,
        summary: 'Ein Gerät zwischen den Messpunkten ändert die maximale Segmentgröße im Verbindungsaufbau (MSS-Clamping). Das ist üblich bei Tunneln und PPPoE und verhindert Probleme mit zu großen Paketen.',
        evidence: [...groupCount(mss, (m) => `${m.dir === 'AB' ? pathAB : pathBA}: MSS ${m.from ?? 'fehlt'} → ${m.to ?? 'fehlt'}`)].map(([k, n]) => `${k} (${plural(n, 'Verbindungsaufbau', 'Verbindungsaufbauten')})`),
        causes: [],
        actions: ['Nur prüfen, falls trotzdem MTU-Probleme auftreten: Der Wert sollte zur kleinsten MTU der Strecke passen (MTU − 40 Byte bei IPv4).'],
        weight: 5,
      }),
    );
  }
  if (stripped.size) {
    const items = [...stripped].map(([k, n]) => {
      const [dir, name] = k.split('|');
      return `${name} (${dir === 'AB' ? pathAB : pathBA}, ${plural(n, 'Verbindung', 'Verbindungen')})`;
    });
    findings.push(
      finding({
        id: 'compare.options_stripped',
        severity: 'warning',
        category: 'Vergleich',
        title: 'TCP-Optionen werden unterwegs entfernt',
        summary: 'Ein Gerät zwischen den Messpunkten löscht Optionen aus dem Verbindungsaufbau. Ohne Window Scaling bleibt das Empfangsfenster auf 64 KB begrenzt (langsam bei hoher Laufzeit), ohne SACK erholt sich TCP schlechter von Verlusten.',
        evidence: items,
        causes: ['„TCP-Normalisierung“ oder Sicherheitsfunktion der Firewall/des IPS.', 'Veralteter Load Balancer oder WAN-Optimierer.'],
        actions: ['Normalisierung/„TCP options“-Einstellungen der Firewall prüfen und die Optionen durchlassen.'],
        weight: 40,
      }),
    );
  }
  const dscpChanges = [];
  for (const d of ['AB', 'BA']) for (const [k, n] of dscp[d]) dscpChanges.push({ d, k, n, lostMark: Number(k.split('→')[0]) > 0 && Number(k.split('→')[1]) === 0 });
  if (dscpChanges.length) {
    const lostMark = dscpChanges.some((x) => x.lostMark);
    findings.push(
      finding({
        id: 'compare.dscp',
        severity: lostMark ? 'warning' : 'info',
        category: 'Vergleich',
