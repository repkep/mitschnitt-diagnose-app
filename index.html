    h('div', { class: 'dz-text' }, h('h1', { text: 'Mitschnitt analysieren' }), h('p', {}, 'Datei hierher ziehen oder auswählen: .pcapng, .pcap, auch gzip-komprimiert (.gz). ', h('span', { class: 'privacy' }, icon('lock', 13), 'Bleibt auf diesem Gerät.'))),
    h(
      'div',
      { class: 'dz-actions' },
      h('label', { class: 'btn primary', for: 'file-input', role: 'button', tabindex: '0', onkeydown: (e) => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), fileInput.click()) }, icon('upload', 15), 'Datei auswählen'),
      state.demo ? null : h('button', { class: 'btn', type: 'button', onclick: () => loadDemo(), text: 'Beispiel ansehen' }),
      h('button', { class: 'btn', type: 'button', onclick: () => openCompareIntake(), title: 'Denselben Verkehr an zwei Stellen mitgeschnitten? Vergleichen zeigt, wo Pakete verloren gehen oder verändert werden.', text: 'Zwei Mitschnitte vergleichen' }),
    ),
  );
  state.compareDrop = null;
  intake.append(zone);
}

function openCompareIntake() {
  if (state.busy) return;
  closeDrawer();
  statusBox.textContent = '';
  intake.textContent = '';
  resultBox.hidden = true;
  const panel = renderCompareIntake({
    dedup: dedupPreferred(),
    onCompare: (files, labels, dedup) => runCompare({ files, labels, dedup }),
    onCancel: () => {
      resultBox.hidden = false;
      renderIntake();
    },
  });
  state.compareDrop = panel.acceptDrop;
  intake.append(panel.el);
  intake.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function runCompare(cmp) {
  const name = `${cmp.files[0].name} ↔ ${cmp.files[1].name}`;
  return task(name, cmp.files[0].size + cmp.files[1].size, 'Mitschnitte werden gelesen …', async (progress) => {
    const settings = currentSettings();
    const [a, b] = await Promise.all(cmp.files.map((f) => f.arrayBuffer().then((x) => new Uint8Array(x))));
    const result = await compareCaptures(a, b, { labels: cmp.labels, names: cmp.files.map((f) => f.name), dedup: cmp.dedup, profile: settings.profile, thresholds: settings.overrides, onProgress: progress });
    closeDrawer();
    state.current = { name, size: null, bytes: null, scan: null, selection: null, demo: false, compare: cmp };
    state.result = result;
    state.demo = false;
    state.tab = 'findings';
    state.sev = null;
    resultBox.hidden = false;
    renderAll();
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function renderActions() {
  actions.textContent = '';
  actions.append(h('button', { class: 'btn', type: 'button', onclick: () => openSettings({ canReanalyze: Boolean(state.current), onApply: () => reanalyze() }), text: 'Schwellwerte' }));
  if (installPrompt) actions.append(h('button', { class: 'btn', type: 'button', onclick: () => installApp(), text: 'App installieren' }));
  if (!state.result) return;
  const r = state.result;
  if (r.packetIndex) actions.append(h('button', { class: 'btn', type: 'button', onclick: () => openExport(r), text: 'Export (pcapng)' }));
  const base = r.kind === 'compare' ? 'vergleich' : (r.fileName || 'mitschnitt').replace(/\.(pcapng|pcap|cap|gz)$/gi, '');
  // Embedded (claude.ai artifact): no print dialog; files go through the host if it allows saving.
  const framed = inFrame();
  const items = [
    framed ? null : ['Als PDF speichern / drucken', () => printReport(r)],
    canSave ? [framed ? 'Bericht als HTML (druckbar als PDF)' : 'Bericht als HTML-Datei', () => saveFile(`${base}-diagnose.html`, reportHtml(r), 'text/html')] : null,
    ['Markdown kopieren', () => copyText(renderMarkdown(r), 'Bericht als Markdown kopiert')],
    canSave ? ['Markdown-Datei (.md)', () => saveFile(`${base}-diagnose.md`, renderMarkdown(r), 'text/markdown')] : null,
    canSave ? ['Rohdaten (.json)', () => saveFile(`${base}-diagnose.json`, JSON.stringify(r, null, 2), 'application/json')] : null,
  ].filter(Boolean);
  actions.append(menu('Bericht', items));
}

// Small dropdown menu (closes on choice, outside click and Escape).
function menu(label, items) {
  const list = h('div', { class: 'menu-list', role: 'menu' });
  const root = h('details', { class: 'menu' }, h('summary', { class: 'btn', role: 'button', 'aria-haspopup': 'menu' }, label, icon('chevron', 12)), list);
  for (const [text, fn] of items) {
    list.append(
      h('button', {
        type: 'button',
        role: 'menuitem',
        text,
        onclick: () => {
          root.open = false;
          fn();
        },
      }),
    );
  }
  root.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && root.open) {
      root.open = false;
      root.querySelector('summary').focus();
    }
  });
  document.addEventListener('click', (e) => {
    if (root.open && !root.contains(e.target)) root.open = false;
  });
  return root;
}

// --- intake handling ------------------------------------------------------------
fileInput.addEventListener('change', () => {
  const f = fileInput.files && fileInput.files[0];
  if (f) handleFile(f);
  fileInput.value = '';
});

let dragDepth = 0;
let overlay = null;
window.addEventListener('dragenter', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth++;
  if (!overlay) {
    overlay = h('div', { class: 'drop-overlay' }, h('div', { text: 'Mitschnitt hier ablegen' }));
    document.body.append(overlay);
  }
});
window.addEventListener('dragover', (e) => {
  if (hasFiles(e)) e.preventDefault();
});
window.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth && overlay) {
    overlay.remove();
    overlay = null;
  }
});
window.addEventListener('drop', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  if (overlay) {
    overlay.remove();
    overlay = null;
  }
  const files = e.dataTransfer.files;
  if (state.compareDrop && files.length) state.compareDrop(files, e.target);
  else if (files[0]) handleFile(files[0]);
});

function hasFiles(e) {
  return e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
}

async function handleFile(file) {
  if (state.busy) {
    pendingFile = file;
    return;
  }
  const current = { name: file.name, size: file.size, bytes: null, scan: null, selection: null, demo: false };
  await task(file.name, file.size, 'Datei wird gelesen …', async (progress) => {
    current.bytes = new Uint8Array(await file.arrayBuffer());
    if (skipSelectionPreferred()) return analyze(current, null, null, progress);
    await scan(current, progress);
    openSelection(current);
  });
}

async function loadDemo() {
  const current = { name: DEMO_FILE_NAME, size: null, bytes: buildDemoCapture(), scan: null, selection: null, demo: true };
  await task(DEMO_FILE_NAME, null, 'Beispiel wird erzeugt …', (progress) => analyze(current, null, null, progress));
}

async function changeSelection() {
  const current = state.current;
  if (!current || state.busy) return;
  if (current.scan) return openSelection(current);
  await task(current.name, current.size, 'Inhalt wird gelesen …', async (progress) => {
    await scan(current, progress);
    openSelection(current);
  });
}

async function scan(current, progress) {
  current.scan = await prescanCapture(current.bytes, { onProgress: (frac, n) => progress(frac, `${fmtInt(n)} Pakete gelesen`) });
  current.bytes = current.scan.bytes; // already decompressed
}

function openSelection(current) {
  statusBox.textContent = '';
  intake.textContent = '';
  resultBox.hidden = true;
  intake.append(
    renderSelection({
      scan: current.scan,
      name: current.name,
      initial: current === state.current ? current.selection : null,
      onAnalyze: (sel, picked) => task(current.name, current.size, 'Auswertung startet …', (progress) => analyze(current, sel, picked, progress)),
      onCancel: () => {
        resultBox.hidden = false;
        renderIntake();
      },
    }),
  );
  intake.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Runs the analysis again with the current file and selection (e.g. after
// changing thresholds).
function reanalyze() {
  const current = state.current;
  if (!current || state.busy) return;
  if (current.compare) return runCompare(current.compare);
  const sel = current.selection;
  const picked = sel && current.scan ? selectPackets(current.scan, sel) : null;
  return task(current.name, current.size, 'Wird neu ausgewertet …', (progress) => analyze(current, picked && !picked.all ? sel : null, picked && !picked.all ? picked : null, progress));
}

async function analyze(current, selection, picked, progress) {
  const settings = currentSettings();
  const result = await analyzeCapture(current.bytes, {
    profile: settings.profile,
    thresholds: settings.overrides,
    keepIndex: true,
    fileName: current.name,
    mask: picked ? picked.mask : undefined,
    // Without a pre-scan (dialog skipped) duplicates are removed on the fly.
    dedup: !picked && !current.demo && dedupPreferred(),
    selectionLabel: selection ? describeSelection(current.scan, selection) : undefined,
    onProgress: (frac, packets) => progress(frac, `${fmtInt(packets)} Pakete ausgewertet`),
  });
  current.selection = selection;
  closeDrawer(); // details of the previous result would be stale
  state.current = current;
  state.result = result;
  state.demo = current.demo;
  state.tab = 'findings';
  state.sev = null;
  resultBox.hidden = false;
  renderAll();
  if (!current.demo) document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Runs a step with a progress box; shows format errors with a hint.
async function task(name, size, initialText, fn) {
  state.busy = true;
  statusBox.textContent = '';
  const bar = h('div', {});
  const label = h('div', {}, h('strong', { text: name }), size ? h('span', { class: 'dim', text: ` · ${fmtBytes(size)}` }) : null);
  const counter = h('div', { class: 'dim', style: { fontSize: '0.8rem', marginTop: '4px' }, text: initialText });
  statusBox.append(h('div', { class: 'status', role: 'status', 'aria-live': 'polite' }, label, h('div', { class: 'progress' }, bar), counter));
  try {
    await fn((frac, text) => {
      bar.style.width = `${Math.round(frac * 100)}%`;
      counter.textContent = text;
    });
    if (statusBox.querySelector('.progress')) statusBox.textContent = '';
  } catch (e) {
    statusBox.textContent = '';
    const known = e instanceof CaptureFormatError;
    statusBox.append(
      h(
        'div',
        { class: 'status error', role: 'alert' },
        h('strong', { text: known ? e.message : 'Die Datei konnte nicht ausgewertet werden.' }),
        known && e.hint ? h('p', { style: { margin: '6px 0 0' }, text: e.hint }) : null,
        !known ? h('p', { style: { margin: '6px 0 0' }, class: 'dim', text: `Technische Meldung: ${e && e.message ? e.message : String(e)}` }) : null,
      ),
    );
    resultBox.hidden = false;
    if (!known) console.error(e);
  } finally {
    state.busy = false;
    if (pendingFile) {
      const f = pendingFile;
      pendingFile = null;
      handleFile(f);
    }
  }
}

// --- result rendering --------------------------------------------------------------
function renderAll() {
  renderIntake();
  renderActions();
  renderResult();
}

function renderResult() {
  resultBox.textContent = '';
  const r = state.result;
  if (!r) return;
  if (r.kind === 'compare') return renderCompareResult(r);
  const c = r.capture;
  const counts = r.summary.counts;

  if (state.demo) {
    resultBox.append(
      h(
        'div',
        { class: 'demo-note' },
        h('b', { text: 'Beispielanalyse.' }),
        h('span', { text: 'Dieser Mitschnitt ist simuliert: ein Büro-PC mit typischen Problemen wie Paketverlust, Rogue-DHCP, IP-Konflikt und Zertifikatsfehler. Eigene Datei oben auswählen, um sie auszuwerten.' }),
      ),
    );
  }

  const verdictText = r.summary.verdict === 'ok' ? 'Keine wesentlichen Probleme gefunden' : r.summary.verdict === 'critical' ? `${counts.critical} kritische${counts.critical === 1 ? 's' : ''} Problem${counts.critical === 1 ? '' : 'e'} gefunden` : `${counts.warning} Auffälligkeit${counts.warning === 1 ? '' : 'en'} gefunden`;
  const top = r.findings.length > 0;
  const tile = (sev, n, label, iconName, color) =>
    h(
      'button',
      {
        class: 'tile',
        type: 'button',
        'aria-pressed': state.sev === sev ? 'true' : 'false',
        onclick: () => {
          state.sev = state.sev === sev || sev === 'ok' ? null : sev;
          state.tab = 'findings';
          renderResult();
        },
      },
      h('span', { class: 'n', text: fmtInt(n) }),
      h('span', { class: 'l' }, icon(iconName, 12, { style: `color:${color}` }), label),
    );

  const verdict = h(
    'div',
    { class: 'panel verdict' },
    h('div', { class: 'eyebrow', text: 'Ergebnis' }),
    h('h2', { class: 'verdict-title', text: verdictText }),
    top
      ? h(
          'ol',
          { class: 'top-findings', 'aria-label': 'Wichtigste Befunde' },
          r.findings.slice(0, 3).map((f) =>
            h('li', {}, icon(f.severity, 14, { style: `color:${f.severity === 'critical' ? 'var(--crit)' : f.severity === 'warning' ? 'var(--warn)' : 'var(--info)'}` }), h('a', { href: `#f-${f.id}`, text: f.title, onclick: (e) => focusFinding(e, f.id) })),
          ),
        )
      : h('p', { class: 'verdict-sub', text: 'Alle Prüfungen ohne Befund. Details unten.' }),
    h(
      'div',
      { class: 'tiles' },
      tile('critical', counts.critical, 'Kritisch', 'critical', 'var(--crit)'),
      tile('warning', counts.warning, 'Warnungen', 'warning', 'var(--warn)'),
      tile('info', counts.info, 'Hinweise', 'info', 'var(--info)'),
      tile('ok', r.checks.length, 'ohne Befund', 'check', 'var(--ok)'),
    ),
  );

  const fact = (k, v) => h('div', {}, h('dt', { text: k }), h('dd', { text: v }));
  const fileFacts = h(
    'div',
    { class: 'panel' },
    h('div', { class: 'panel-top' }, h('div', { class: 'eyebrow', text: 'Mitschnitt' }), r.selection ? null : h('button', { class: 'btn small', type: 'button', text: 'Auswahl / Filter', onclick: () => changeSelection() })),
    h('div', { class: 'file-name', style: { marginTop: '6px' }, text: r.fileName || 'Unbenannt' }),
    h(
      'dl',
      { class: 'facts' },
      fact('Pakete', r.selection ? `${fmtInt(c.packets)} von ${fmtInt(c.totalPackets)}` : fmtInt(c.packets)),
      fact('Dauer', fmtDuration(c.duration)),
      fact('Daten', fmtBytes(c.bytes)),
      fact('Ø Datenrate', c.avgBps ? fmtBits(c.avgBps) : '–'),
      fact('Beginn', fmtDate(c.firstTs)),
      fact('Format', `${c.format}${c.formatVersion ? ` ${c.formatVersion}` : ''} · ${c.linktypes.join(', ')}`),
      c.application ? fact('Aufgezeichnet mit', c.application) : null,
      fact('Schwellwerte', `${r.settings.profileLabel}${r.settings.changed.length ? ' (angepasst)' : ''}`),
      fact('Analysezeit', `${fmtInt(r.analysisMs)} ms`),
    ),
  );
  if (r.selection) {
    resultBox.append(
      h(
        'div',
        { class: 'selection-note' },
        h('span', {}, h('b', { text: 'Gefiltert: ' }), `${fmtInt(r.selection.included)} von ${fmtInt(r.selection.total)} Paketen ausgewertet`, r.selection.description ? ` · ${r.selection.description}` : ''),
        h(
          'span',
          { class: 'selection-actions' },
          h('button', { class: 'btn small', type: 'button', text: 'Auswahl ändern', onclick: () => changeSelection() }),
          h('button', {
            class: 'btn small',
            type: 'button',
            text: 'Alles auswerten',
            onclick: () => task(state.current.name, state.current.size, 'Auswertung startet …', (progress) => analyze(state.current, null, null, progress)),
          }),
        ),
      ),
    );
  }
  resultBox.append(h('div', { class: 'result-head' }, verdict, fileFacts));

  const tabs = [
    ['findings', 'Befunde', r.findings.length],
    ['timeline', 'Zeitverlauf', null],
    ['tcp', 'Verbindungen', r.tables.tcp.length],
    ['dns', 'DNS', r.stats.dns ? r.stats.dns.queries : 0],
    ['tls', 'TLS & HTTP', r.tables.tls.length + r.tables.http.length],
    ['hosts', 'Hosts & Protokolle', r.stats.hostCount],
  ];
  renderTabs(r, tabs, { findings: () => renderFindings(r, state.sev), timeline: () => renderTimelineTab(r), tcp: () => renderConnections(r), dns: () => renderDns(r), tls: () => renderTlsHttp(r), hosts: () => renderHosts(r) });
}

function renderCompareResult(r) {
  resultBox.append(
    renderCompareHead(r, {
      sev: state.sev,
      onTile: (sev) => {
        state.sev = state.sev === sev || sev === 'ok' ? null : sev;
        state.tab = 'findings';
        renderResult();
      },
    }),
  );
  renderTabs(
    r,
    [
      ['findings', 'Befunde', r.findings.length],
      ['conversations', 'Verbindungen', r.tables.conversations.length],
    ],
    { findings: () => renderFindings(r, state.sev), conversations: () => renderCompareConversations(r) },
  );
}

function renderTabs(r, tabs, views) {
  if (!views[state.tab]) state.tab = 'findings';
  const tablist = h('div', { class: 'tabs', role: 'tablist', 'aria-label': 'Ansichten' });
  const panel = h('div', { class: 'tabpanel', role: 'tabpanel', id: 'tabpanel' });
  for (const [id, label, count] of tabs) {
    tablist.append(
      h(
        'button',
        {
          class: 'tab',
          role: 'tab',
          type: 'button',
          id: `tab-${id}`,
          'aria-selected': state.tab === id ? 'true' : 'false',
          'aria-controls': 'tabpanel',
          onclick: () => {
            state.tab = id;
            if (id !== 'findings') state.sev = null;
            renderResult();
            document.getElementById(`tab-${id}`).focus();
          },
        },
        label,
        count !== null ? h('span', { class: 'count', text: fmtInt(count) }) : null,
      ),
    );
  }
  resultBox.append(tablist, panel);
  panel.setAttribute('aria-labelledby', `tab-${state.tab}`);
  if (state.tab === 'findings' && state.sev) {
    panel.append(
      h(
        'p',
        { class: 'dim', style: { margin: '0 0 10px' } },
        `Gefiltert: nur ${{ critical: 'kritische Befunde', warning: 'Warnungen', info: 'Hinweise' }[state.sev]}. `,
        h('button', {
          class: 'btn small',
          type: 'button',
          text: 'Alle anzeigen',
          onclick: () => {
            state.sev = null;
            renderResult();
          },
        }),
      ),
    );
  }
  panel.append(views[state.tab]());
}

function focusFinding(e, id) {
  e.preventDefault();
  if (state.tab !== 'findings' || state.sev) {
    state.tab = 'findings';
    state.sev = null;
    renderResult();
  }
  const el = document.getElementById(`f-${id}`);
  if (el) {
    el.open = true;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

// --- installable app (PWA) -------------------------------------------------------
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installPrompt = e;
  renderActions();
});
window.addEventListener('appinstalled', () => {
  installPrompt = null;
  renderActions();
  toast('App installiert – Mitschnitte lassen sich jetzt auch direkt damit öffnen');
});

async function installApp() {
  if (!installPrompt) return;
  const ev = installPrompt;
  installPrompt = null;
  ev.prompt();
  await ev.userChoice.catch(() => null);
  renderActions();
}

// The hosted version (build --site) links a manifest: then work offline and
// accept capture files opened with the installed app.
if (document.querySelector('link[rel="manifest"]') && 'serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if ('launchQueue' in window) {
  window.launchQueue.setConsumer(async (params) => {
    if (!params.files || !params.files.length) return;
    const file = await params.files[0].getFile();
    handleFile(file);
  });
}

saveApi().then((api) => {
  if (Boolean(api) !== canSave) {
    canSave = Boolean(api);
    renderActions();
  }
});

// --- start: open with the simulated example so the first view shows the tool ----
renderIntake();
renderActions();
loadDemo().catch((e) => {
  console.error(e);
  toast('Beispiel konnte nicht geladen werden');
});

return {  };
})();
})();
